<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capture des boîtes de Petri</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EFE6D2">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petri">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- Détection des marqueurs ArUco (js-aruco2) : cv.js, puis aruco.js, puis le dictionnaire 4×4 -->
<script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/cv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/aruco.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/dictionaries/aruco_4x4_1000.js"></script>
<style>
@font-face{font-family:"ByteBounce";src:url("fonts/ByteBounce.ttf") format("truetype");font-display:swap}
/* Style rétro : fond beige, encre noire, police pixelisée. Toujours affiché en paysage. */
:root{
  --bg:#EFE6D2; --paper:#F8F2E4; --ink:#1A1A1A; --muted:#5E5546;
  --wait:#E0A526; --ok:#3A9A5B; --err:#D2452F; --viewer:#111;
  --dish:#F2C14E; --lid:#6EC5D9;
  --b:3px; /* épaisseur des traits */
  --ar:1.7778;
  --side:clamp(15rem,32vw,24rem); /* largeur du panneau de gauche */ /* proportions de l'image caméra, mises à jour par le script */
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);
  /* ByteBounce n'a pas tous les accents : Pixelify Sans prend le relais pour les caractères manquants */
  font-family:"ByteBounce","Pixelify Sans",ui-monospace,"Courier New",monospace;
  font-size:19px;line-height:1.35;-webkit-tap-highlight-color:transparent;
  display:grid;grid-template-columns:var(--side) 1fr;overflow:hidden;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:var(--b) dashed var(--ink);outline-offset:3px}

/* Panneau de gauche : titre, mascotte et bulle, boutons ; l'aperçu occupe la droite */
.side{display:flex;flex-direction:column;gap:.7rem;padding:.7rem .3rem .8rem 1rem;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:.6rem;white-space:nowrap}
.brand .title{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.reload svg{width:20px;height:20px}
.flag{padding:3px;min-height:0;border:var(--b) solid var(--ink);background:var(--paper);box-shadow:var(--b) var(--b) 0 var(--ink);line-height:0;cursor:pointer}
.flag:active{transform:translate(var(--b),var(--b));box-shadow:none}
.flag svg{width:32px;height:20px;display:block;shape-rendering:crispEdges}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;padding:0 var(--b) var(--b) 0}
.nav .btn{justify-content:center}
.brand h1{font-size:1.2rem;margin:0;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ver{font-size:.75rem;color:var(--muted)}
.btn{
  border:var(--b) solid var(--ink);background:var(--paper);border-radius:0;
  padding:.3rem .8rem;min-height:40px;display:inline-flex;align-items:center;gap:.45rem;
  box-shadow:var(--b) var(--b) 0 var(--ink);font-weight:600;
}
.btn:active:not([disabled]){transform:translate(var(--b),var(--b));box-shadow:none}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.danger{color:var(--err);border-color:var(--err);box-shadow:var(--b) var(--b) 0 var(--err)}
.btn[disabled]{opacity:.4;cursor:default}
.count{background:var(--ink);color:var(--paper);padding:0 .4rem;font-size:.85rem;min-width:1.6rem;text-align:center}

/* Mascotte au-dessus de sa bulle ; la bulle reprend le message et ses boutons */
main{position:relative;display:grid;min-height:0;padding:.6rem 1rem .8rem .6rem}
/* la mascotte prend la place qui reste et rétrécit si l'écran est peu haut (barre de navigation Android affichée…) ;
   le message, les actions et le menu gardent toujours leur taille et ne se chevauchent jamais */
.talk{display:contents}
.side > *{flex:none}
.side .mascot{flex:0 1 calc(30*var(--s));min-height:36px;width:100%;max-height:calc(30*var(--s))}
.side .mascot canvas{object-fit:contain}
/* messages courts, en simple texte noir */
.status{align-self:stretch;display:flex;flex-direction:column;gap:.55rem;flex:none}
.status .txt{display:flex;flex-direction:column;gap:.15rem;min-width:0}
/* hauteurs réservées (titre sur 1 ligne, phrase sur 3 lignes, 1 rangée d'actions) : le menu en dessous ne bouge jamais */
.status .big{font-size:clamp(1.15rem,4.6vh,1.9rem);font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .small{font-size:clamp(.9rem,2.9vh,1.15rem);line-height:1.25;height:3.75em;overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
.status .actions{--ah:46px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.5rem;height:calc(var(--ah) + var(--b));padding:0 var(--b) var(--b) 0;margin-bottom:.3rem}
.status .actions .btn{justify-content:center;text-align:center;height:var(--ah);min-height:0;padding:.15rem .35rem;line-height:1.05;white-space:normal}

.stage{container-type:size;display:grid;place-items:center;min-height:0}
.frame{
  position:relative;padding:6px;background:var(--ink);
  box-shadow:8px 8px 0 rgba(26,26,26,.16);
}
.frame[data-tone="ok"]{background:var(--ok)}
.frame[data-tone="err"]{background:var(--err)}
/* le logiciel travaille (chargement, mesure, mise au point) : pointillés qui tournent autour du cadre */
.frame[data-tone="busy"]{
  background-color:var(--paper);
  background-image:linear-gradient(90deg,var(--ink) 50%,transparent 0),linear-gradient(90deg,var(--ink) 50%,transparent 0),
    linear-gradient(0deg,var(--ink) 50%,transparent 0),linear-gradient(0deg,var(--ink) 50%,transparent 0);
  background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;
  background-size:24px 6px,24px 6px,6px 24px,6px 24px;
  background-position:0 0,0 100%,0 0,100% 0;
  animation:ants .8s steps(8) infinite;
}
@keyframes ants{to{background-position:24px 0,-24px 100%,0 -24px,100% 24px}}
.screen{
  position:relative;overflow:hidden;background:var(--viewer);aspect-ratio:var(--ar);
  width:calc(min(100cqw - 20px, (100cqh - 20px) * var(--ar)) * var(--fit,.97));
}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--viewer)}
svg#overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}
.flash.go{animation:flash .8s steps(6) forwards}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}

.meters{
  position:absolute;top:.5rem;left:.5rem;display:grid;grid-template-columns:auto auto;gap:.05rem .7rem;
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:.3rem .55rem;font-size:.8rem;
  font-variant-numeric:tabular-nums;pointer-events:none;opacity:.92
}
.meters b{font-weight:700;text-align:right}
.btn.lens{position:absolute;top:.5rem;right:.5rem;min-height:34px;padding:.15rem .6rem;font-size:.9rem}
.btn.lens[hidden]{display:none}
.meters.hidden{display:none}

/* Mascotte : boîte de Petri en pixel art, dessinée image par image dans un canevas (voir le script) */
.mascot{--s:4px;flex:none;width:calc(28*var(--s));height:calc(30*var(--s))}
.mascot canvas{display:block;width:100%;height:100%;image-rendering:pixelated}

@media (prefers-reduced-motion: reduce){
  .frame[data-tone="busy"]{animation-duration:2.4s}
  .flash.go{animation-duration:.35s}
}

/* Panneaux latéraux */
.sheet{
  position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--paper);
  border-left:5px solid var(--ink);z-index:20;display:flex;flex-direction:column;
  transform:translateX(105%);transition:transform .25s steps(5);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.sheet.open{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheet-head{display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;border-bottom:5px solid var(--ink)}
.sheet-head h2{margin:0 auto 0 0;font-size:1.2rem;text-transform:uppercase;letter-spacing:.06em}
.sheet-body{overflow:auto;padding:1rem;flex:1}
/* Réglages : le quart droit reste vide pour faire défiler au pouce sans toucher un curseur */
#sheetSettings .sheet-body{padding-right:calc(25% + 1rem)}
.sheet-foot{padding:.75rem 1rem;border-top:5px solid var(--ink);display:flex;gap:.6rem;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(26,26,26,.35);z-index:15;display:none}
.scrim.open{display:block}

.field{margin-bottom:1.1rem}
.field label{display:flex;justify-content:space-between;gap:1rem;font-weight:700;margin-bottom:.25rem}
.field label span{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.field p{margin:.2rem 0 0;color:var(--muted);font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--ink);min-height:36px}
.check{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;min-height:36px}
.check input{width:22px;height:22px;accent-color:var(--ink)}
select{width:100%;min-height:44px;border:var(--b) solid var(--ink);border-radius:0;background:var(--bg);padding:0 .6rem}
.group-title{font-size:.95rem;margin:1.4rem 0 .6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px dashed var(--ink);padding-bottom:.2rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.7rem}
.thumb{border:var(--b) solid var(--ink);overflow:hidden;background:var(--bg);position:relative}
.thumb img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover;background:#000}
.thumb .meta{padding:.25rem .4rem;font-size:.78rem;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center;gap:.25rem;border-top:2px solid var(--ink)}
.thumb .tag{font-size:.7rem;color:var(--ok);font-weight:700}
.thumb button{border:none;background:none;color:var(--err);font-size:1.05rem;padding:.1rem .3rem;min-height:30px}
.empty{color:var(--muted);text-align:center;padding:2rem 1rem}
.note{font-size:.9rem;color:var(--muted);margin:.25rem 0 0;width:100%}

/* Écran d'accueil */
.start{
  position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:1.5rem;overflow:auto;
  padding-top:calc(1.5rem + env(safe-area-inset-top,0px));padding-bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));
}
.start.hidden{display:none}
.start-card{
  max-width:46rem;display:flex;align-items:center;gap:2rem;
  background:var(--paper);border:var(--b) solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:1.4rem 1.8rem;
}
.start-card .mascot{--s:6px}
.start h2{font-size:clamp(1.4rem,3.4vw,2.1rem);line-height:1.1;margin:0 0 .7rem}
.start p{margin:0 0 .7rem;color:var(--muted)}
.start ol{padding-left:1.3rem;margin:0 0 1.2rem}
.start li{margin-bottom:.3rem}
.start .btn.primary{font-size:1.15rem;padding:.6rem 1.3rem}
.error-box{margin-top:1rem;padding:.7rem 1rem;border:var(--b) solid var(--err);color:var(--ink);display:none}
.error-box.show{display:block}
.toast{
  position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:.5rem 1rem;z-index:40;display:none;max-width:90vw;
  box-shadow:var(--b) var(--b) 0 var(--muted)
}
.toast.show{display:block}

/* Calibration manuelle : l'aperçu prend tout l'écran, avec seulement Annuler et Confirmer */
.manual-bar{position:absolute;left:50%;bottom:.8rem;transform:translateX(-50%);display:none;gap:.8rem}
body.manual{grid-template-columns:1fr}
body.manual .side{display:none}
body.manual main{padding:.5rem}
body.manual .screen{--fit:.99}
body.manual .manual-bar{display:flex}
body.manual .meters,body.manual .btn.lens{display:none}

/* L'app est prévue pour le paysage : en portrait, on demande de tourner l'appareil */
.rotate{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;place-items:center;align-content:center;gap:1.2rem;padding:2rem;text-align:center}
.rotate .mascot{--s:7px}
.rotate p{font-size:1.4rem;font-weight:700;margin:0}
@media (orientation:portrait){ .rotate{display:grid} }
/* paysage peu haut (téléphone) : on resserre */
@media (max-height:480px){
  .side{padding:.4rem .2rem .5rem .7rem;gap:.45rem}
  .side .btn{min-height:34px;padding:.15rem .5rem;font-size:.9rem}
  .status .actions{--ah:38px}
  .status .actions .btn{font-size:.8rem}
  .nav{gap:.4rem}
  .brand h1{font-size:1rem}
  .flag svg{width:26px;height:16px}
  .reload svg{width:16px;height:16px}
  main{padding:.4rem .7rem .5rem .4rem}
  .mascot{--s:3px}
  .screen{--fit:.98}
  .meters{font-size:.68rem;padding:.2rem .4rem}
  .start-card .mascot{--s:4px}
}
</style>
</head>
<body>

<aside class="side">
  <div class="brand"><div class="title"><h1>Petri·Capture</h1><span class="ver" id="ver"></span></div>
    <button class="flag reload" id="btnReload" type="button" data-i18n-aria="reload"></button>
    <button class="flag" id="btnLang" type="button"></button></div>
  <div class="talk">
    <div class="mascot" id="mascot" aria-hidden="true"></div>
    <div class="status" id="status" data-tone="idle" role="status" aria-live="polite">
      <div class="txt"><span class="big" id="stBig"></span><span class="small" id="stSmall"></span></div>
      <div class="actions" id="stActions"></div>
    </div>
  </div>
  <nav class="nav">
    <button class="btn" id="btnCalib" type="button" data-i18n="calibrate"></button>
    <button class="btn" id="btnPhotos" type="button"><span data-i18n="photos"></span> <span class="count" id="countBadge">0</span></button>
    <button class="btn" id="btnSettings" type="button" data-i18n="settings"></button>
    <button class="btn" id="btnFull" type="button"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
  </nav>
</aside>

<main>
  <div class="stage">
    <div class="frame" id="frame" data-tone="idle">
      <div class="screen" id="viewer">
        <video id="video" playsinline muted autoplay></video>
        <svg id="overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="flash" id="flash"></div>
        <button class="btn lens" id="btnLens" type="button" hidden data-i18n="lens"></button>
        <div class="meters" id="meters">
          <span data-i18n="dish"></span><b id="mDish">–</b>
          <span data-i18n="lid"></span><b id="mLid">–</b>
          <span data-i18n="motion"></span><b id="mMotion">–</b>
          <span data-i18n="sharpness"></span><b id="mSharp">–</b>
        </div>
        <div class="manual-bar">
          <button class="btn" id="btnManCancel" type="button" data-i18n="cancel"></button>
          <button class="btn primary" id="btnManOk" type="button" data-i18n="confirm"></button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="scrim" id="scrim"></div>

<aside class="sheet" id="sheetPhotos">
  <div class="sheet-head"><h2 data-i18n="savedPhotos"></h2><button class="btn" data-close type="button" data-i18n="close"></button></div>
  <div class="sheet-body"><div class="grid" id="grid"></div></div>
  <div class="sheet-foot">
    <button class="btn primary" id="btnShare" type="button" data-i18n="share"></button>
    <button class="btn" id="btnZip" type="button" data-i18n="zip"></button>
    <button class="btn danger" id="btnClearExported" type="button" data-i18n="clearExported"></button>
    <p class="note" data-i18n="exportNote"></p>
  </div>
</aside>

<aside class="sheet" id="sheetSettings">
  <div class="sheet-head"><h2 data-i18n="settings"></h2><button class="btn" data-close type="button" data-i18n="close"></button></div>
  <div class="sheet-body">
    <div class="group-title" data-i18n="grpDetect"></div>
    <div class="field">
      <label for="sSens"><span data-i18n="sSens"></span> <span id="vSens"></span></label>
      <input type="range" id="sSens" min="6" max="60" step="1">
      <p data-i18n="sSensHelp"></p>
    </div>
    <div class="field">
      <label for="sPresence"><span data-i18n="sPresence"></span> <span id="vPresence"></span></label>
      <input type="range" id="sPresence" min="5" max="70" step="1">
      <p data-i18n="sPresenceHelp"></p>
    </div>
    <div class="field">
      <label for="sStable"><span data-i18n="sStable"></span> <span id="vStable"></span></label>
      <input type="range" id="sStable" min="300" max="4000" step="100">
    </div>
    <div class="field">
      <label for="sMotion"><span data-i18n="sMotion"></span> <span id="vMotion"></span></label>
      <input type="range" id="sMotion" min="1" max="10" step="0.5">
      <p data-i18n="sMotionHelp"></p>
    </div>
    <div class="field">
      <label for="sFocus"><span data-i18n="sFocus"></span> <span id="vFocus"></span></label>
      <input type="range" id="sFocus" min="500" max="4000" step="100">
      <p data-i18n="sFocusHelp"></p>
    </div>

    <div class="group-title" data-i18n="grpChecks"></div>
    <label class="check"><input type="checkbox" id="cLid"> <span data-i18n="cLid"></span></label>
    <label class="check"><input type="checkbox" id="cSharp"> <span data-i18n="cSharp"></span></label>
    <label class="check"><input type="checkbox" id="cLock"> <span data-i18n="cLock"></span></label>
    <label class="check"><input type="checkbox" id="cMeters"> <span data-i18n="cMeters"></span></label>
    <label class="check"><input type="checkbox" id="cSound"> <span data-i18n="cSound"></span></label>
    <div class="row"><button class="btn" id="tOk" type="button" data-i18n="tOk"></button><button class="btn" id="tErr" type="button" data-i18n="tErr"></button></div>

    <div class="group-title" data-i18n="grpCamera"></div>
    <div class="field"><select id="camSelect" data-i18n-aria="grpCamera"></select><p id="camInfo"></p></div>
    <div class="row"><button class="btn" id="btnRef" type="button" data-i18n="btnRef"></button></div>

    <div class="group-title" data-i18n="grpCalib"></div>
    <div class="field">
      <label for="selCalib" data-i18n="selCalib"></label>
      <select id="selCalib">
        <option value="aruco" data-i18n="optAruco"></option>
        <option value="manuel" data-i18n="optManual"></option>
      </select>
      <p data-i18n="selCalibHelp"></p>
    </div>
    <div class="row"><button class="btn" id="btnCalib2" type="button" data-i18n="calibNow"></button></div>
  </div>
</aside>

<section class="start" id="start">
  <div class="start-card">
    <div class="mascot" aria-hidden="true"></div>
    <div>
    <h2 data-i18n="startTitle"></h2>
    <p data-i18n="startIntro"></p>
    <ol>
      <li data-i18n="step1"></li>
      <li data-i18n="step2"></li>
      <li data-i18n="step3"></li>
    </ol>
    <div class="row"><button class="btn primary" id="btnStart" type="button" data-i18n="start"></button>
    <button class="btn" id="btnDemo" type="button" data-i18n="demo"></button></div>
    <div class="error-box" id="startError"></div>
    </div>
  </div>
</section>

<div class="rotate" id="rotate">
  <div class="mascot" aria-hidden="true"></div>
  <p data-i18n="rotate"></p>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="mascot.js"></script>
<script src="demo.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const APP_VERSION = 'v18 · 26/10'; // à incrémenter à chaque publication
$('ver').textContent = APP_VERSION;

/* ---------- Mascotte (dessin et animation dans mascot.js) ---------- */
const mascots = [...document.querySelectorAll('.mascot')].map(el => PetriMascot.create(el));
function mascotTalk(){ mascots[0].talk(); }
const video = $('video'), svg = $('overlay');
const SVGNS = 'http://www.w3.org/2000/svg';

/* ---------- Réglages persistants ---------- */

// drapeaux en pixel art (16 × 10)
function flagSvg(code){
  const px = [];
  for (let y = 0; y < 10; y++) for (let x = 0; x < 16; x++){
    let c;
    if (code === 'fr') c = x < 5 ? '#1F3A93' : x < 11 ? '#FFFFFF' : '#D2452F';
    else {
      const dx = x - 7.5, dy = y - 4.5, d1 = Math.abs(dy - dx*10/16), d2 = Math.abs(dy + dx*10/16);
      c = '#1F3A93';
      if (d1 < 1.2 || d2 < 1.2) c = '#FFFFFF';
      if (d1 < .5 || d2 < .5) c = '#D2452F';
      if (Math.abs(dx) < 2 || Math.abs(dy) < 2) c = '#FFFFFF';
      if (Math.abs(dx) < 1 || Math.abs(dy) < 1) c = '#D2452F';
    }
    px.push('<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + c + '"/>');
  }
  return '<svg viewBox="0 0 16 10" aria-hidden="true">' + px.join('') + '</svg>';
}

function initAudio(){
  if (!audio){ try{ audio = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if (audio && audio.state === 'suspended') audio.resume();
}
function tone(freq, start, dur, type, vol){
  if (!audio) return;
  const t = audio.currentTime + start, o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.35, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + 0.05);
}

/* ---------- Stockage des photos (IndexedDB) ---------- */
let dbp = null;
function db(){
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open('petri-capture', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath:'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(modeRW, fn){
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction('photos', modeRW), s = t.objectStore('photos');
    const out = fn(s);
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abandon'));
  });
}
const photoPut = rec => tx('readwrite', s => s.put(rec));
const photoDel = id => tx('readwrite', s => s.delete(id));
const photoAll = () => tx('readonly', s => s.getAll());

let demo = /[?&]demo\b/.test(location.search);
async function startCamera(){
  const err = $('startError'); err.classList.remove('show');
  if (!demo && (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)){
    showStartError(t('errNoApi'));
    return;
  }
  try{
    if (stream) stream.getTracks().forEach(t => t.stop());
    focusLocked = false; lockVerify = false; refreshRef = false; // nouvelle caméra : nouvelle mise au point
    const v = { width:{ ideal:3840 }, height:{ ideal:2160 } };
    if (settings.deviceId) v.deviceId = { exact: settings.deviceId }; else v.facingMode = { ideal:'environment' };
    try{ stream = demo ? PetriDemo.start() : await navigator.mediaDevices.getUserMedia({ video:v, audio:false }); }
    catch(e){
      if (settings.deviceId && (e.name === 'OverconstrainedError' || e.name === 'NotFoundError')){
        settings.deviceId = ''; store.set('petri.settings', settings);
        stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ideal:3840}, height:{ideal:2160} }, audio:false });
      } else throw e;
    }
    track = stream.getVideoTracks()[0];
    video.srcObject = stream;
    await video.play().catch(() => {});
    await new Promise(r => { if (video.videoWidth) r(); else video.onloadedmetadata = () => r(); });
    try{
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.includes('continuous')) await track.applyConstraints({ advanced:[{ focusMode:'continuous' }] });
    }catch(e){}
    onVideoSize();
    $('start').classList.add('hidden');
    listCameras();
    requestWake();
    if (calib && Math.abs(calib.aspect - W/H) < 0.02) startRun(true);
    else enterCalibration(calib ? 'shapeChanged' : null);
    if (!loopTimer) loop();
  }catch(e){
    const n = e && e.name;
    if (n === 'NotAllowedError' || n === 'SecurityError')
      showStartError(t('errDenied'));
    else if (n === 'NotFoundError') showStartError(t('errNoCam'));
    else if (n === 'NotReadableError') showStartError(t('errBusy'));
    else showStartError(t('errStart', { e: n || e }));
  }
}
function showStartError(msg){ $('start').classList.remove('hidden'); const b = $('startError'); b.textContent = msg; b.classList.add('show'); }

/* ---------- Socles : géométrie ----------
   Chaque socle est décrit par une transformation h (matrice 3 × 3, 9 nombres) qui envoie ses coordonnées
   en millimètres (centre du cercle = origine, nord = +Y) vers l'image, en fractions de la largeur et de la hauteur.
   Calibration automatique : homographie (4 marqueurs) ou affine (3) ; manuelle : cercle = simple mise à l'échelle. */
const SOCLE_R = 51.5;            // rayon du socle (103 mm)
const MARK_D = 35.75;            // distance centre du socle → centre d'un marqueur
const MARK_POS = [[0, MARK_D], [MARK_D, 0], [0, -MARK_D], [-MARK_D, 0]]; // ID % 4 : nord, est, sud, ouest
const SOCLE_IDS = { dish:[0, 1, 2, 3], lid:[4, 5, 6, 7] };
const baseName = k => t(k === 'dish' ? 'baseDish' : 'baseLid');

function project(h, X, Y){
  const w = h[6]*X + h[7]*Y + h[8];
  return { x:(h[0]*X + h[1]*Y + h[2]) / w, y:(h[3]*X + h[4]*Y + h[5]) / w };
}
function invert3(m){
  const [a,b,c,d,e,f,g,h,i] = m, A = e*i - f*h, B = f*g - d*i, C = d*h - e*g, det = a*A + b*B + c*C;
  return [A/det, (c*h - b*i)/det, (b*f - c*e)/det, B/det, (a*i - c*g)/det, (c*d - a*f)/det, C/det, (b*g - a*h)/det, (a*e - b*d)/det];
}
// résolution d'un petit système linéaire (élimination de Gauss avec pivot partiel)
function solve(A, b){
  const n = b.length, M = A.map((r, i) => r.concat(b[i]));
  for (let c = 0; c < n; c++){

      A.push([p.X, p.Y, 1, 0, 0, 0, -p.x*p.X, -p.x*p.Y]); b.push(p.x);
      A.push([0, 0, 0, p.X, p.Y, 1, -p.y*p.X, -p.y*p.Y]); b.push(p.y);
    });

  pts.forEach(p => { A.push([p.X, p.Y, 1, 0, 0, 0]); b.push(p.x); A.push([0, 0, 0, p.X, p.Y, 1]); b.push(p.y); });

// zone d'un socle en pixels de l'image : centre, contour projeté, rayon inscrit et encadrement

    const t = i / 64 * 2 * Math.PI, p = project(h, s*Math.cos(t), s*Math.sin(t)), x = p.x*W, y = p.y*H;

  }
  return { cx:c.x*W, cy:c.y*H, pts, rMin, x0, y0, x1, y1 };
}

function defaultCircles(){
  if (H > W) return { dish:{ x:.5, y:.33, r:.42 }, lid:{ x:.5, y:.77, r:.3 } };
  return { dish:{ x:.36, y:.5, r:.34 }, lid:{ x:.76, y:.5, r:.24 } };
}
const mn = () => Math.min(W, H);
function circlePx(c){ return { cx:c.x*W, cy:c.y*H, r:c.r*mn() }; }

const lidOn = () => !!settings.requireLid;
const circleKeys = () => lidOn() ? ['dish','lid'] : ['dish'];
const placeMsg = () => t(lidOn() ? 'placeLid' : 'place');
function buildMasks(){
  const d = [], l = [], o = [], lid = lidOn();
  const iD = invert3(calib.dish.h), iL = invert3(calib.lid.h);
  const dist = (m, u, v) => { const p = project(m, u, v); return Math.hypot(p.x, p.y) / SOCLE_R; };
  for (let y = 0; y < ah; y++) for (let x = 0; x < aw; x++){
    const u = (x + .5) / aw, v = (y + .5) / ah, i = y*aw + x;
    const dd = dist(iD, u, v), dl = dist(iL, u, v);
    if (dd < .92) d.push(i);

/* Glisser-déposer des cercles (calibration manuelle) */
let drag = null, manual = null;
function svgPoint(ev){
  const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('pointerdown', ev => {
  if (mode !== 'calib') return;
  const role = ev.target.getAttribute('data-role'); if (!role) return;
  const k = ev.target.parentNode.getAttribute('data-k');
  const p = svgPoint(ev), c = circlePx(manual[k]);

});
svg.addEventListener('pointermove', ev => {
  if (!drag || ev.pointerId !== drag.id) return;
  const p = svgPoint(ev), c = manual[drag.k];
  if (drag.role === 'move'){
    c.x = Math.min(1, Math.max(0, (p.x - drag.dx) / W));
    c.y = Math.min(1, Math.max(0, (p.y - drag.dy) / H));
  } else {
    const cp = circlePx(c);

function applyManual(){

}
const endDrag = ev => { if (drag && ev.pointerId === drag.id) drag = null; };
svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);

/* ---------- Calibration automatique par les marqueurs ArUco ---------- */
let detector = null, autoRun = 0, auto = null; // auto : { found, fits, pending, problems }
const dcv = document.createElement('canvas'), dctx = dcv.getContext('2d', { willReadFrequently:true });
function getDetector(){
  if (!detector && window.AR && AR.DICTIONARIES && AR.DICTIONARIES.ARUCO_4X4_1000)
    detector = new AR.Detector({ dictionaryName:'ARUCO_4X4_1000' }); // les 50 premiers codes = DICT_4X4_50 d'OpenCV
  return detector;
}
// centre d'un marqueur : intersection des diagonales (insensible à la rotation de la tuile et juste en perspective)
function markerCenter(c){
  const [p0, p1, p2, p3] = c, d1x = p2.x - p0.x, d1y = p2.y - p0.y, d2x = p3.x - p1.x, d2y = p3.y - p1.y;
  const den = d1x*d2y - d1y*d2x;
  if (Math.abs(den) < 1e-9) return { x:(p0.x + p1.x + p2.x + p3.x)/4, y:(p0.y + p1.y + p2.y + p3.y)/4 };
  const t = ((p1.x - p0.x)*d2y - (p1.y - p0.y)*d2x) / den;
  return { x:p0.x + t*d1x, y:p0.y + t*d1y };
}
// détecte sur l'image courante ; renvoie { id: {x, y} } en fractions de l'image, pour les ID 0 à 7
function detectMarkers(src, sw, sh){
  const s = Math.min(1, 1600 / sw), w = Math.round(sw*s), h = Math.round(sh*s);
  dcv.width = w; dcv.height = h; dctx.drawImage(src, 0, 0, w, h);
  const out = {};
  getDetector().detect(dctx.getImageData(0, 0, w, h)).forEach(m => {
    if (m.id < 0 || m.id > 7) return;
    const c = markerCenter(m.corners); out[m.id] = { x:c.x / w, y:c.y / h };
  });
  return out;
}

// calcule la transformation d'un socle à partir des marqueurs trouvés
function fitSocle(k, found){
  const ids = SOCLE_IDS[k], have = ids.filter(id => found[id]), missing = ids.filter(id => !found[id]);
  const names = list => list.map(id => id + ' (' + t('dirs')[id % 4] + ')').join(', ');
  if (have.length < 3) return { k, missing, few:true, error: () => t('errMissing', { base:baseName(k), list:names(missing) }) };
  const h = fitTransform(have.map(id => ({ X:MARK_POS[id % 4][0], Y:MARK_POS[id % 4][1], x:found[id].x, y:found[id].y })));
  if (!h) return { k, missing, error: () => t('errAligned', { base:baseName(k) }) };
  // contrôle : pas d'image inversée ni repliée sur toute la surface du socle
  for (let i = 0; i <= 16; i++){
    const th = i / 16 * 2 * Math.PI, r = i === 16 ? 0 : SOCLE_R;
    if (!(localDet(h, r*Math.cos(th), r*Math.sin(th)) < 0))
      return { k, missing, error: () => t('errMirror', { base:baseName(k) }) };
  }
  const area = Math.abs(localDet(h, 0, 0)) * Math.PI * SOCLE_R * SOCLE_R / (W*H);
  if (area < .005 || area > .9) return { k, missing, error: () => t('errSize', { base:baseName(k) }) };

}
async function enterAuto(reason){
  const run = ++autoRun;
  leaveManual(); unlockFocus();
  mode = 'auto'; state = 'idle'; ref = null; auto = null; drawOverlay();
  if (!getDetector()){
    setStatus('err', T('noDetector'), T('noDetectorD'),
      [{ label:T('retry'), fn: () => enterAuto() }, { label:T('manualBtn'), primary:true, fn: () => enterCalib() }]);
    return;
  }
  setStatus('busy', T('findMarkers'), () => (reason ? t(reason) + ' ' : '') + t('keepEmpty'), [{ label:T('manualBtn'), fn: () => enterCalib() }]);
  // plusieurs images : un marqueur doit être vu au moins 2 fois, on garde la médiane de ses centres
  const seen = {}, need = ids => ids.every(id => seen[id] && seen[id].length >= 3);
  let frames = 0;
  for (; frames < 10; frames++){
    await new Promise(r => setTimeout(r, 120));
    if (run !== autoRun || mode !== 'auto') return;
    try{
      const f = detectMarkers(video, W, H);
      for (const id in f) (seen[id] = seen[id] || []).push(f[id]);
    }catch(e){}
    if (frames >= 3 && need(SOCLE_IDS.dish) && (!lidOn() || need(SOCLE_IDS.lid))) break;
  }
  const found = {};
  for (const id in seen) if (seen[id].length >= 2) found[id] = { x:median(seen[id].map(p => p.x)), y:median(seen[id].map(p => p.y)) };
  const fits = circleKeys().map(k => fitSocle(k, found));
  if (fits.length === 2 && !fits[0].error && !fits[1].error){
    const ratio = fits[0].scale / fits[1].scale;
    if (ratio < .6 || ratio > 1.65) fits[1].error = T('errRatio');
  }
  auto = { found, fits };
  const errors = fits.filter(f => f.error);
  if (errors.length){
    drawOverlay();
    setStatus('err', T('calibFail'), () => !Object.keys(found).length ? t('noMarkers') : errors.map(f => f.error()).join(' ') + (errors.some(f => f.few) ? ' ' + t('need3') : ''),
      [{ label:T('retry'), primary:true, fn: () => enterAuto() }, { label:T('manualBtn'), fn: () => enterCalib() }]);
    return;
  }
  const prevLid = calib && calib.lid && calib.lid.h ? calib.lid : { h:circleToH(defaultCircles().lid) };
  auto.pending = { dish:{ h:fits[0].h }, lid: lidOn() ? { h:fits[1].h } : prevLid, aspect:W/H, source:'aruco' };
  drawOverlay();
  const detail = () => [t('checkCircles')].concat(fits.filter(f => f.missing.length).map(f => t('partial', { base:baseName(f.k), n:f.have.length }))).join(' ');
  setStatus('wait', T('calibFound'), detail,
    [{ label:T('saveBtn'), primary:true, fn: () => { if (!auto || !auto.pending) return; calib = auto.pending; auto = null; startRun(false); } },
     { label:T('retry'), fn: () => enterAuto() }, { label:T('manualBtn'), fn: () => enterCalib() }]);
}
// affichage du résultat : marqueurs trouvés (carrés pleins), manquants estimés (pointillés), zones projetées
function drawAuto(){
  if (!auto) return;
  const fs = mn() * 0.034, sz = mn() * 0.03;
  auto.fits.forEach(f => {
    if (f.h){
      if (auto.pending) drawZone(f.k, f.h, COLOR[f.k], false);
      f.missing.forEach(id => { const p = project(f.h, MARK_POS[id % 4][0], MARK_POS[id % 4][1]);
        svg.appendChild(el('rect', { x:p.x*W - sz/2, y:p.y*H - sz/2, width:sz, height:sz, fill:'none', stroke:'#D2452F', 'stroke-width':3, 'stroke-dasharray':'6 5', 'vector-effect':'non-scaling-stroke' }));
        svg.appendChild(svgLabel(id + ' ?', p.x*W, p.y*H - sz*0.9, '#D2452F', fs)); });
    }
  });
  for (const id in auto.found){
    const p = auto.found[id], k = id < 4 ? 'dish' : 'lid';
    svg.appendChild(el('rect', { x:p.x*W - sz/2, y:p.y*H - sz/2, width:sz, height:sz, fill:COLOR[k], stroke:'#111', 'stroke-width':2, 'vector-effect':'non-scaling-stroke' }));
    svg.appendChild(svgLabel(String(id), p.x*W, p.y*H - sz*0.9, COLOR[k], fs));
  }
}

/* ---------- Modes ---------- */
function enterCalibration(reason){ if (settings.calibMode === 'manuel') enterCalib(reason); else enterAuto(reason); }
/* Calibration manuelle : l'aperçu prend tout l'écran, avec un cercle par socle, Annuler et Confirmer */
let manualBack = null; // ce qu'Annuler rétablit (retour à la recherche des marqueurs ou à la calibration précédente)
function enterCalib(reason){
  const from = mode, prev = calib, base = (auto && auto.pending) || prev; // cercles de départ : résultat des marqueurs s'il y en a un
  if (from === 'auto') manualBack = () => enterAuto();
  else if (from === 'run' && prev) manualBack = () => { calib = prev; startRun(true); };
  else if (from !== 'calib') manualBack = null;
  autoRun++; auto = null;
  unlockFocus();
  mode = 'calib'; state = 'idle'; ref = null;
  manual = base && Math.abs(base.aspect - W/H) <= 0.02 ? { dish:circleFromH(base.dish.h), lid:circleFromH(base.lid.h) } : defaultCircles();
  document.body.classList.add('manual'); $('btnManCancel').disabled = !manualBack;
  setStatus('idle', T('placeCircles'), () => (reason ? t(reason) + ' ' : '') + t('keepEmpty'));
  drawOverlay();
}
function leaveManual(){ document.body.classList.remove('manual'); }
$('btnManOk').addEventListener('click', () => { if (mode !== 'calib') return; leaveManual(); manualBack = null; applyManual(); startRun(false); });
$('btnManCancel').addEventListener('click', () => { if (mode !== 'calib' || !manualBack) return; const back = manualBack; manualBack = null; leaveManual(); back(); });
async function startRun(silent){
  autoRun++; leaveManual();
  calib.aspect = W/H; store.set(calibKey(), calib);
  buildMasks(); mode = 'run';
  await takeReference();
  state = 'empty'; lastMsg = null; drawOverlay();
  setStatus('wait', T('ready'), placeMsg, runActions());
  if (!silent) toast(t('calibSaved'));
}
async function takeReference(){
  refPending = true;
  setStatus('busy', T('bgMeasure'), T('keepEmpty'));
  const n = aw*ah, acc = new Float32Array(n*3); const frames = 5;
  for (let f = 0; f < frames; f++){
    actx.drawImage(video, 0, 0, aw, ah);
    const d = actx.getImageData(0, 0, aw, ah).data;
    for (let i = 0; i < n; i++){ acc[i*3] += d[i*4]; acc[i*3+1] += d[i*4+1]; acc[i*3+2] += d[i*4+2]; }
    await new Promise(r => setTimeout(r, 90));
  }
  for (let i = 0; i < acc.length; i++) acc[i] /= frames;
  ref = acc; prevL = null; refPending = false;
}

/* ---------- Analyse d'image ---------- */
function analyse(){
  actx.drawImage(video, 0, 0, aw, ah);
  const d = actx.getImageData(0, 0, aw, ah).data, n = aw*ah;
  // compensation d'exposition globale à partir de la zone hors cercles
  let sc = 0, sr = 0;
  for (let j = 0; j < idxOut.length; j++){ const i = idxOut[j], p = i*4, q = i*3; sc += d[p]+d[p+1]+d[p+2]; sr += ref[q]+ref[q+1]+ref[q+2]; }
  let gain = (idxOut.length > 40 && sr > 0) ? sc / sr : 1;
  gain = Math.min(2, Math.max(.5, gain));
  const T = settings.sens;
  const frac = idx => {
    if (!idx.length) return 0;
    let c = 0;
    for (let j = 0; j < idx.length; j++){
      const i = idx[j], p = i*4, q = i*3;
      const a = Math.abs(d[p]/gain - ref[q]), b = Math.abs(d[p+1]/gain - ref[q+1]), e = Math.abs(d[p+2]/gain - ref[q+2]);
      if (a > T || b > T || e > T) c++;
    }
    return c / idx.length;
  };
  const fDish = frac(idxDish), fLid = frac(idxLid);
  let motion = 0;
  const L = new Float32Array(n);
  for (let i = 0; i < n; i++){ L[i] = (d[i*4]*.3 + d[i*4+1]*.59 + d[i*4+2]*.11); if (prevL) motion += Math.abs(L[i] - prevL[i]); }
  motion = prevL ? motion / n : 0; prevL = L;

}

function dishPixels(d){
  const out = new Float32Array(idxDish.length*3);
  for (let j = 0; j < idxDish.length; j++){ const p = idxDish[j]*4; out[j*3] = d[p]; out[j*3+1] = d[p+1]; out[j*3+2] = d[p+2]; }
  return out;
}
function changedFrac(d, base){
  const T = settings.sens; let c = 0;
  for (let j = 0; j < idxDish.length; j++){
    const p = idxDish[j]*4, q = j*3;
    if (Math.abs(d[p]-base[q]) > T || Math.abs(d[p+1]-base[q+1]) > T || Math.abs(d[p+2]-base[q+2]) > T) c++;
  }
  return idxDish.length ? c / idxDish.length : 0;
}
function dishSquare(){
  const c = zonePx(calib.dish.h), r = c.rMin * .78;
  let x = Math.max(0, c.cx - r), y = Math.max(0, c.cy - r);
  let s = Math.min(2*r, W - x, H - y);
  return { x, y, s };
}
function sharpness(){
  const q = dishSquare(), N = 256; scv.width = N; scv.height = N;
  sctx.drawImage(video, q.x, q.y, q.s, q.s, 0, 0, N, N);
  const d = sctx.getImageData(0, 0, N, N).data, g = new Float32Array(N*N);
  for (let i = 0; i < N*N; i++) g[i] = d[i*4]*.3 + d[i*4+1]*.59 + d[i*4+2]*.11;
  let s = 0, s2 = 0, k = 0;

    s += v; s2 += v*v; k++;
  }
  const m = s/k; return s2/k - m*m;
}
function cropRect(){
  // encadrement des zones projetées, agrandi de 8 % autour de chaque centre
  const zs = (lidOn() ? ['dish','lid'] : ['dish']).map(k => zonePx(calib[k].h)), pad = 1.08;
  let x0 = Math.min(...zs.map(z => z.cx - (z.cx - z.x0)*pad)), y0 = Math.min(...zs.map(z => z.cy - (z.cy - z.y0)*pad));
  let x1 = Math.max(...zs.map(z => z.cx + (z.x1 - z.cx)*pad)), y1 = Math.max(...zs.map(z => z.cy + (z.y1 - z.cy)*pad));
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
  x1 = Math.min(W, Math.ceil(x1)); y1 = Math.min(H, Math.ceil(y1));
  return { x:x0, y:y0, w:x1-x0, h:y1-y0 };
}
function grabBest(){
  const r = cropRect(); bestCv.width = r.w; bestCv.height = r.h;
  bestCtx.drawImage(video, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
}
function medianSharp(){
  if (sharpHistory.length < 3) return 0;
  const a = sharpHistory.slice().sort((x, y) => x - y); return a[Math.floor(a.length/2)];
}

/* ---------- Machine d'état ---------- */
function loop(){
  const MOTION_T = settings.motionTol;
  loopTimer = setTimeout(loop, 120);
  if (mode !== 'run' || !ref || refPending || !video.videoWidth || state === 'saving') return;
  const a = analyse(), now = performance.now(), P = settings.presence / 100;
  if (settings.meters){
    $('mDish').textContent = Math.round(a.fDish*100) + ' %';
    $('mLid').textContent = lidOn() ? Math.round(a.fLid*100) + ' %' : '–';
    $('mMotion').textContent = a.motion.toFixed(1);
  }
  switch (state){
    case 'empty':
      if (a.fDish > P){ state = 'settling'; tSince = now; sounds.tick(); drawOverlay();
        setStatus('busy', T('detected'), T('holdStill'), runActions()); }
      else if (a.fDish < P*.3 && a.motion < 1.2){
        // adaptation lente aux variations de lumière
        for (let i = 0, n = aw*ah; i < n; i++){ ref[i*3] += (a.d[i*4]-ref[i*3])*.02; ref[i*3+1] += (a.d[i*4+1]-ref[i*3+1])*.02; ref[i*3+2] += (a.d[i*4+2]-ref[i*3+2])*.02; }
      }
      break;
    case 'settling':
      if (a.fDish < P*.5){ toEmpty(); break; }
      if (a.motion > MOTION_T) tSince = now;
      if (now - tSince >= settings.stableMs) beginFocus(now);
      break;
    case 'focusing': {
      // les images prises pendant un mouvement sont ignorées au lieu de faire échouer la prise
      if (a.motion <= MOTION_T*1.5){
        const s = sharpness();
        if (settings.meters) $('mSharp').textContent = Math.round(s);
        if (s > bestSharp){ bestSharp = s; grabBest(); }
      }
      if (now - tFocus >= focusDur){
        if (bestSharp < 0){ // aucune image immobile : on attend encore un peu
          if (now - tFocus >= focusDur + 1500) fail(T('failMoved'), T('failMovedD'));
          break;
        }
        // double contrôle : avec la mise au point verrouillée, l'image doit rester aussi nette qu'à la première photo
        // (la netteté dépend du contenu de chaque boîte : on ne refait la mise au point que pour une image vraiment floue)
        if (focusLocked){ const m = medianSharp(); if (m > 0 && bestSharp < m*.45){ unlockFocus(); toast(t('refocus')); beginFocus(now); break; } }
        if (settings.requireLid && a.fLid < P*.5){ fail(T('failLid'), T('failLidD')); break; }
        const med = medianSharp();
        if (!focusLocked && settings.sharpCheck && med > 0 && bestSharp < med*.45){ fail(T('failBlur'), T('failBlurD', { v:Math.round(bestSharp), m:Math.round(med) })); break; }
        save();
      }
      break; }
    case 'retry':
      if (a.fDish < P*.5){ if (!tEmptySince) tEmptySince = now; if (now - tEmptySince > 600){ failStreak = 0; toEmpty(); } break; }
      tEmptySince = 0;
      if (now - tRetry >= 900){ state = 'settling'; tSince = now; drawOverlay();
        setStatus('busy', T('retrying'), T('holdStill'), runActions()); }
      break;
    case 'wait_removal': {
      // vérifie sur la même boîte, et sur plusieurs images, que le verrouillage n'a pas dégradé la netteté
      if (lockVerify && a.fDish >= P*.5 && a.motion < MOTION_T){
        verifyMax = Math.max(verifyMax, sharpness());
        if (++verifyN >= 5){
          lockVerify = false;
          if (verifyMax < lockSharp*.5){ unlockFocus(); toast(t('lockFail')); }
          else toast(t('lockOk'));
        }
      }
      if (a.fDish < P*.5){ if (!tEmptySince) tEmptySince = now; if (now - tEmptySince > 600){ snap = null; toEmpty(); } break; }
      tEmptySince = 0;
      if (!snap){ if (a.motion < MOTION_T){ snap = dishPixels(a.d); tSwap = 0; } break; }
      // boîte remplacée sans passer par un socle vide : la zone a changé par rapport à la photo précédente
      if (changedFrac(a.d, snap) > P && a.motion < MOTION_T){
        if (!tSwap) tSwap = now;
        if (now - tSwap > 400){ snap = null; state = 'settling'; tSince = now; sounds.tick(); drawOverlay();
          setStatus('busy', T('newDish'), T('holdStill'), runActions()); }
      } else tSwap = 0;
      break; }
  }
}
function toEmpty(){
  failStreak = 0; lockVerify = false;
  // premier socle vide après le verrouillage : on reprend le fond avec la nouvelle mise au point
  if (refreshRef){ refreshRef = false; takeReference().then(toEmpty); return; }
  state = 'empty'; tEmptySince = 0; drawOverlay();
  setStatus('wait', T('ready'), placeMsg, runActions());
}
const QUICK_MS = 500;
async function beginFocus(now){
  state = 'focusing'; tFocus = now; bestSharp = -1; drawOverlay();
  focusDur = focusLocked ? QUICK_MS : settings.focusMs;
  setStatus('busy', T(focusLocked ? 'shooting' : 'focusing'), T('holdStill'), []);
  if (focusLocked) return;
  try{
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    const adv = {};
    if (caps.focusMode && caps.focusMode.includes('single-shot')) adv.focusMode = 'single-shot';
    if (caps.pointsOfInterest !== undefined) { const c = project(calib.dish.h, 0, 0); adv.pointsOfInterest = [{ x:c.x, y:c.y }]; }
    if (Object.keys(adv).length) await track.applyConstraints({ advanced:[adv] });
  }catch(e){}
}
async function restoreFocus(){
  try{
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous')) await track.applyConstraints({ advanced:[{ focusMode:'continuous' }] });
  }catch(e){}
}
async function lockFocus(sharp){
  focusLocked = true; lockSharp = sharp; verifyN = 0; verifyMax = 0; lockVerify = true; refreshRef = true;
  try{
    const caps = track.getCapabilities ? track.getCapabilities() : {}, cur = track.getSettings ? track.getSettings() : {};
    if (caps.focusMode && caps.focusMode.includes('manual') && cur.focusDistance !== undefined)
      await track.applyConstraints({ advanced:[{ focusMode:'manual', focusDistance:cur.focusDistance }] });
    // sinon le mode « single-shot » appliqué pour la mise au point reste en place
  }catch(e){}
}
function unlockFocus(){
  if (focusLocked) restoreFocus();
  focusLocked = false; lockVerify = false; refreshRef = false;
}
function afterShot(ok){
  if (ok && settings.lockFocus){
    if (!focusLocked) lockFocus(bestSharp);
  }
  if (!focusLocked) restoreFocus();
}
function manualCapture(){
  if (mode !== 'run' || !ref) return;
  initAudio();
  if (state === 'focusing' || state === 'saving') return;
  beginFocus(performance.now());
}
function fail(title, detail, final){
  // échec ponctuel : message affiché 1 s, puis nouvel essai automatique tant que la boîte est là
  state = final ? 'wait_removal' : 'retry'; tRetry = performance.now(); tEmptySince = 0; snap = null; lastMsg = { ok:false }; afterShot(false);
  if (!failStreak++ || final) sounds.err(); // un seul son d'erreur par série d'essais
  flash('#D9433D'); drawOverlay();
  setStatus('err', title, () => txt(detail) + ' ' + t(final ? 'removeToRetry' : 'retryAuto'), runActions());
}
function pad(n){ return String(n).padStart(2, '0'); }
async function save(){
  state = 'saving';
  setStatus('busy', T('saving'), '', []);
  try{
    if (bestCv.width < 10) throw new Error('image vide');
    const blob = await new Promise((res, rej) => bestCv.toBlob(b => b ? res(b) : rej(new Error('encodage impossible')), 'image/jpeg', .93));
    const dt = new Date(), id = Date.now();
    let name = dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate()) + '_' + pad(dt.getHours()) + 'h' + pad(dt.getMinutes()) + 'm' + pad(dt.getSeconds()) + 's.jpg';
    const all = await photoAll();
    if (all.some(r => r.name === name)){ let k = 2; while (all.some(r => r.name === name.replace('.jpg', '-' + k + '.jpg'))) k++; name = name.replace('.jpg', '-' + k + '.jpg'); }
    await photoPut({ id, name, blob, w:bestCv.width, h:bestCv.height, sharp:bestSharp, exported:false });
    sharpHistory.push(bestSharp); if (sharpHistory.length > 15) sharpHistory.shift(); store.set('petri.sharp', sharpHistory);
    const total = await photoCount(); $('countBadge').textContent = total;
    state = 'wait_removal'; tEmptySince = 0; snap = null; lastMsg = { ok:true }; failStreak = 0; afterShot(true);
    sounds.ok(); flash('#1E9E5E'); drawOverlay();
    setStatus('ok', T('saved'), T('savedSmall', { n:total }), runActions());
  }catch(e){
    const quota = e && (e.name === 'QuotaExceededError');
    fail(T('failSave'), quota ? T('failQuota') : T('failErr', { e: e && e.message || e }), true);
  }
}

/* ---------- Panneaux ---------- */
function openSheet(id){ document.querySelectorAll('.sheet').forEach(s => s.classList.toggle('open', s.id === id)); $('scrim').classList.add('open'); }
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open')); $('scrim').classList.remove('open'); revokeThumbs(); }
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheets));
$('scrim').addEventListener('click', closeSheets);

let thumbUrls = [];
function revokeThumbs(){ thumbUrls.forEach(u => URL.revokeObjectURL(u)); thumbUrls = []; }
async function renderGrid(){
  revokeThumbs();
  const g = $('grid'); g.innerHTML = '';
  let all = [];
  try{ all = (await photoAll()).sort((a, b) => b.id - a.id); }catch(e){}
  if (!all.length){ const p = document.createElement('p'); p.className = 'empty'; p.textContent = t('emptyGrid'); g.appendChild(p); }
  all.forEach(r => {
    const u = URL.createObjectURL(r.blob); thumbUrls.push(u);
    const d = document.createElement('div'); d.className = 'thumb';
    const img = document.createElement('img'); img.src = u; img.alt = r.name; img.loading = 'lazy';
    const m = document.createElement('div'); m.className = 'meta';
    const s = document.createElement('span'); s.textContent = r.name.replace('.jpg', '').replace('_', ' ');
    m.appendChild(s);
    if (r.exported){ const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = t('exported'); m.appendChild(tag); }
    const del = document.createElement('button'); del.type = 'button'; del.textContent = '✕'; del.setAttribute('aria-label', t('delAria', { n:r.name }));
    del.addEventListener('click', async () => { if (confirm(t('del', { n:r.name }))){ await photoDel(r.id); renderGrid(); refreshCount(); } });
    m.appendChild(del);
    d.append(img, m); g.appendChild(d);
  });
  $('btnShare').disabled = $('btnZip').disabled = !all.length;
  $('btnClearExported').disabled = !all.some(r => r.exported);
}
async function markExported(ids){
  for (const id of ids){ await tx('readwrite', s => { const q = s.get(id); q.onsuccess = () => { if (q.result){ q.result.exported = true; s.put(q.result); } }; return q; }); }
}

$('btnShare').addEventListener('click', async () => {
  const all = await photoAll(); if (!all.length) return;
  const files = all.map(r => new File([r.blob], r.name, { type:'image/jpeg' }));
  if (navigator.canShare && navigator.canShare({ files })){
    try{
      await navigator.share({ files });
      await markExported(all.map(r => r.id)); renderGrid();
      toast(t('shared', { n:all.length }));
    }catch(e){ if (e.name !== 'AbortError') toast(t('shareFail', { e:e.message })); }
  } else {
    toast(t('shareNA'));
  }
});
$('btnZip').addEventListener('click', async () => {
  const all = await photoAll(); if (!all.length) return;
  if (!window.JSZip){ toast(t('zipNA')); return; }
  const btn = $('btnZip'); btn.disabled = true; btn.textContent = t('zipBusy');
  try{
    const zip = new JSZip();
    all.forEach(r => zip.file(r.name, r.blob, { binary:true }));
    const blob = await zip.generateAsync({ type:'blob', compression:'STORE' });
    const dt = new Date(), fname = 'petri_' + dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate()) + '_' + pad(dt.getHours()) + 'h' + pad(dt.getMinutes()) + '.zip';
    let done = false;
    if (window.claude && typeof window.claude.use === 'function'){
      const dl = await window.claude.use('downloads');
      if (dl){
        try{ await dl.save({ filename:fname, data:blob }); done = true; }
        catch(e){ if (e && e.code === 'declined'){ btn.textContent = t('zip'); btn.disabled = false; return; } }
      }
    }
    if (!done){
      const u = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = u; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 30000); done = true;
    }
    await markExported(all.map(r => r.id)); renderGrid(); toast(t('zipReady', { f:fname }));
  }catch(e){ toast(t('exportFail', { e:e.message || e })); }
  btn.textContent = t('zip'); btn.disabled = false;
});
$('btnClearExported').addEventListener('click', async () => {
  const ex = (await photoAll()).filter(r => r.exported);
  if (!ex.length) return;
  if (!confirm(t('clearConfirm', { n:ex.length }))) return;
  for (const r of ex) await photoDel(r.id);
  renderGrid(); refreshCount();
});

/* ---------- Réglages ---------- */
const rangeLabels = []; // réaffichées au changement de langue (séparateur décimal)
function bindRange(id, key, fmt){
  const i = $(id), v = $(id.replace('s', 'v'));
  i.value = settings[key]; v.textContent = fmt(settings[key]); rangeLabels.push(() => { v.textContent = fmt(settings[key]); });
  i.addEventListener('input', () => { settings[key] = +i.value; v.textContent = fmt(+i.value); store.set('petri.settings', settings); });
}
bindRange('sSens', 'sens', x => x);
bindRange('sPresence', 'presence', x => x + ' %');
bindRange('sStable', 'stableMs', x => (x/1000).toFixed(1).replace('.', t('dec')) + ' s');
bindRange('sMotion', 'motionTol', x => String(x).replace('.', t('dec')));
bindRange('sFocus', 'focusMs', x => (x/1000).toFixed(1).replace('.', t('dec')) + ' s');
function bindCheck(id, key, after){
  const c = $(id); c.checked = !!settings[key];
  c.addEventListener('change', () => { settings[key] = c.checked; store.set('petri.settings', settings); after && after(); });
}
bindCheck('cLid', 'requireLid', () => {
  if (calib && W){ buildMasks(); drawOverlay(); }
  if (mode === 'calib') drawOverlay();
  else if (mode === 'auto') enterAuto();
  else if (mode === 'run' && state === 'empty') setStatus('wait', T('ready'), placeMsg, runActions());
}); bindCheck('cSharp', 'sharpCheck'); bindCheck('cLock', 'lockFocus', () => { if (!settings.lockFocus) unlockFocus(); }); bindCheck('cSound', 'sound');
bindCheck('cMeters', 'meters', () => $('meters').classList.toggle('hidden', !settings.meters));
$('meters').classList.toggle('hidden', !settings.meters);
$('tOk').addEventListener('click', () => { initAudio(); const s = settings.sound; settings.sound = true; sounds.ok(); settings.sound = s; });
$('tErr').addEventListener('click', () => { initAudio(); const s = settings.sound; settings.sound = true; sounds.err(); settings.sound = s; });
function useCamera(id, label){
  settings.deviceId = id; store.set('petri.settings', settings);
  calib = store.get(calibKey(), null);
  if (label) toast(t('lensT', { l:label }) + (calib ? '' : t('needCalib')));
  startCamera();
}
$('camSelect').addEventListener('change', e => useCamera(e.target.value));
$('btnLens').addEventListener('click', () => {
  if (lenses.length < 2) return;
  const cur = track && track.getSettings ? track.getSettings().deviceId : settings.deviceId;
  const i = lenses.findIndex(d => d.deviceId === cur), next = lenses[(i + 1) % lenses.length];
  useCamera(next.deviceId, next.label || t('camN', { n:(i + 1) % lenses.length + 1 }));
});
$('btnRef').addEventListener('click', async () => { if (mode !== 'run') return; closeSheets(); await takeReference(); toEmpty(); toast(t('bgUpdated')); });
$('btnCalib2').addEventListener('click', () => { closeSheets(); if (stream) enterCalibration(); });
const selCalib = $('selCalib'); selCalib.value = settings.calibMode;
selCalib.addEventListener('change', () => { settings.calibMode = selCalib.value; store.set('petri.settings', settings); });

/* ---------- En-tête ---------- */
$('btnStart').addEventListener('click', () => { initAudio(); demo = false; startCamera(); try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} });
$('btnDemo').addEventListener('click', () => { initAudio(); demo = true; startCamera().then(() => toast(t('demoHint'))); });
// démo : un clic sur l'image pose ou retire la boîte et son couvercle
$('viewer').addEventListener('click', () => { if (demo && mode === 'run') PetriDemo.toggle(); });
if (demo) startCamera().then(() => toast(t('demoHint')));
$('btnCalib').addEventListener('click', () => { if (stream) enterCalibration(); });
$('btnPhotos').addEventListener('click', () => { openSheet('sheetPhotos'); renderGrid(); });
$('btnSettings').addEventListener('click', () => { openSheet('sheetSettings'); listCameras(); });
$('btnFull').addEventListener('click', () => {
  initAudio();
  const d = document, e = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else {
    const f = e.requestFullscreen || e.webkitRequestFullscreen;
    if (!f){ toast(t('noFullscreen')); return; }
    Promise.resolve(f.call(e)).then(() => { try{ return screen.orientation.lock('landscape'); }catch(err){} }).catch(() => {});
  }
});
// Télécommande / pédale Bluetooth (envoient Espace, Entrée ou Page suivante)
document.addEventListener('keydown', e => {
  if (['Space','Enter','PageDown','ArrowRight','NumpadEnter'].includes(e.code) && mode === 'run' && !document.querySelector('.sheet.open')){
    e.preventDefault(); manualCapture();
  }
});
document.addEventListener('pointerdown', initAudio, { once:true });

/* ---------- Langue ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(e => e.setAttribute('aria-label', t(e.dataset.i18nAria)));
  const other = lang === 'en' ? 'fr' : 'en', b = $('btnLang');
  b.innerHTML = flagSvg(lang); b.setAttribute('aria-label', t('langSwitch')); b.title = t('langSwitch');
  $('btnReload').title = t('reload');
  rangeLabels.forEach(f => f());
  if (lastStatus) setStatus(...lastStatus); else setStatus('idle', T('waiting'), '');
  if (W) drawOverlay();
  if ($('sheetPhotos').classList.contains('open')) renderGrid();
  if ($('sheetSettings').classList.contains('open')) listCameras();
}
// Recharger : demande la dernière version au service worker, vide son cache, puis recharge la page
// (une app installée ne se met pas toujours à jour toute seule)
$('btnReload').innerHTML = '<svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">' +
  ['....####.#..','...#....##..','..#....###..','..#.........','.#..........','.#........#.','.#........#.','..#......#..','...#....#...','....####....']
    .map((r, y) => [...r].map((ch, x) => ch === '#' ? '<rect x="' + x + '" y="' + (y + 1) + '" width="1" height="1"/>' : '').join('')).join('') + '</svg>';
$('btnReload').addEventListener('click', async () => {
  $('btnReload').disabled = true;
  try{
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update();
    if (window.caches) await Promise.all((await caches.keys()).map(k => caches.delete(k)));
  }catch(e){}
  location.reload();
});
$('btnLang').addEventListener('click', () => { lang = lang === 'en' ? 'fr' : 'en'; settings.lang = lang; store.set('petri.settings', settings); applyLang(); });
applyLang();
refreshCount();
// installation comme application (Chrome : « Installer l'application ») et fonctionnement hors connexion
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
