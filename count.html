<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comptage des boîtes de Petri</title>
<meta name="theme-color" content="#EFE6D2">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@font-face{font-family:"ByteBounce";src:url("fonts/ByteBounce.ttf") format("truetype");font-display:swap}
/* Même style que l'app de capture : fond beige, encre noire, police pixelisée */
:root{
  --bg:#EFE6D2; --paper:#F8F2E4; --ink:#1A1A1A; --muted:#5E5546;
  --ok:#3A9A5B; --err:#D2452F; --viewer:#111; --dish:#F2C14E;
  --b:3px; --side:clamp(19rem,27vw,25rem);
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"ByteBounce","Pixelify Sans",ui-monospace,"Courier New",monospace;font-size:19px;line-height:1.35;
  display:grid;grid-template-columns:1fr var(--side);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:var(--b) dashed var(--ink);outline-offset:3px}
.btn{
  border:var(--b) solid var(--ink);background:var(--paper);border-radius:0;
  padding:.3rem .8rem;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  box-shadow:var(--b) var(--b) 0 var(--ink);font-weight:600;
}
.btn:active:not([disabled]){transform:translate(var(--b),var(--b));box-shadow:none}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.danger{color:var(--err);border-color:var(--err);box-shadow:var(--b) var(--b) 0 var(--err)}
.btn.small{min-height:32px;padding:.1rem .5rem;font-size:.85rem}
.flag{padding:3px;min-height:0;border:var(--b) solid var(--ink);background:var(--paper);box-shadow:var(--b) var(--b) 0 var(--ink);line-height:0;cursor:pointer}
.flag:active{transform:translate(var(--b),var(--b));box-shadow:none}
.flag svg{width:32px;height:20px;display:block;shape-rendering:crispEdges}
input[type=text]{width:100%;min-height:40px;border:var(--b) solid var(--ink);border-radius:0;background:var(--paper);padding:0 .55rem;margin:0 var(--b) var(--b) 0;box-shadow:var(--b) var(--b) 0 var(--ink)}
input[type=text]:focus{outline:none;background:#fff}
.muted{color:var(--muted)}

/* ---------- Colonne principale : en-tête, image, navigation ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:.7rem .6rem .8rem 1rem;gap:.6rem}
.top{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding:0 var(--b) var(--b) 0}
.brand{display:flex;flex-direction:column;margin-right:auto;white-space:nowrap}
.brand h1{font-size:1.2rem;margin:0;letter-spacing:.08em;text-transform:uppercase}
.ver{font-size:.75rem;color:var(--muted)}
.folder{font-size:.9rem;color:var(--muted);max-width:22rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:.4rem}
.folder svg{width:26px;height:22px;flex:none;shape-rendering:crispEdges}
.folder span{overflow:hidden;text-overflow:ellipsis}
/* aperçu toujours en 16:9 (format des photos de Petri-capture), le plus grand possible dans la place disponible */
.stage{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
.frame{position:relative;box-sizing:content-box;width:min(100cqw - 22px, (100cqh - 22px) * 16 / 9);aspect-ratio:16/9;padding:6px;background:var(--ink);box-shadow:8px 8px 0 rgba(26,26,26,.16)}
.screen{position:absolute;inset:6px;overflow:hidden;background:var(--viewer);cursor:crosshair;touch-action:none;user-select:none}
.screen.panning{cursor:grabbing}
.pan{position:absolute;left:0;top:0;transform-origin:0 0}
.pan img{display:block;width:100%;height:100%;image-rendering:auto;pointer-events:none}
.pan svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.empty{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:1rem;color:var(--paper);text-align:center;padding:2rem;cursor:default}
.empty p{margin:0;max-width:30rem}
.empty .row{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;padding:0 var(--b) var(--b) 0}
.empty .btn{color:var(--ink);box-shadow:var(--b) var(--b) 0 #666}
.empty .btn.primary{background:var(--dish);color:var(--ink)}
.zoomhint{position:absolute;left:.6rem;bottom:.5rem;color:#ddd;font-size:.75rem;pointer-events:none;text-shadow:0 1px 2px #000}
.zoombar{position:absolute;right:.6rem;top:.6rem;display:flex;gap:.4rem;padding:0 var(--b) var(--b) 0}
.nav{display:flex;align-items:center;gap:.8rem;padding:0 var(--b) var(--b) 0}
.nav .file{flex:1;min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .file b{display:block;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis}
.nav .file span{font-size:.8rem;color:var(--muted)}
.nav .btn{min-width:9rem}

/* ---------- Panneau de droite : compteur, nom, tableau ---------- */
.side{display:flex;flex-direction:column;gap:.7rem;min-height:0;padding:.7rem 1rem .8rem .3rem}
.card{background:var(--paper);border:var(--b) solid var(--ink);box-shadow:var(--b) var(--b) 0 var(--ink);padding:.6rem .7rem}
.counter{display:flex;align-items:center;gap:.6rem}
.counter .num{flex:1;text-align:center;line-height:1}
.counter .num b{display:block;font-size:clamp(3rem,7vh,4.6rem);font-variant-numeric:tabular-nums}
.counter .num span{font-size:.85rem;color:var(--muted);letter-spacing:.1em}
.counter .btn{width:46px;padding:0;font-size:1.3rem}
.lbl{display:block;font-size:1.3rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:.6rem 0 .3rem}
.lbl:first-child{margin-top:0}
.inline{display:flex;gap:.45rem;align-items:center}
.inline input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 var(--b) var(--b) 0;margin-bottom:.4rem}
.chip{display:inline-flex;align-items:center;border:2px solid var(--ink);background:var(--bg);font-size:.85rem;box-shadow:2px 2px 0 var(--ink)}
.chip button{border:0;background:none;padding:.15rem .5rem;min-height:30px;display:inline-flex;align-items:center;gap:.4rem}
/* case cochée : groupe sélectionné pour l'image en cours */
.chip .tick{width:16px;height:16px;flex:none;border:2px solid currentColor;background:var(--paper)}
.chip[aria-pressed="true"] .tick{background:var(--paper) url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%207%206%27%20shape-rendering%3D%27crispEdges%27%20fill%3D%27%231A1A1A%27%3E%3Cpath%20d%3D%27M6%200h1v2H6zM5%201h1v2H5zM4%202h1v2H4zM0%202h1v2H0zM1%203h1v2H1zM3%203h1v2H3zM2%204h1v2H2z%27%2F%3E%3C%2Fsvg%3E") center/10px 9px no-repeat;border-color:var(--paper)}
.chip .x{padding:.15rem .4rem;border-left:2px solid var(--ink);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] .x{color:var(--paper);border-left-color:var(--paper)}
.final{margin-top:.55rem;padding:.35rem .5rem;border:2px dashed var(--ink);font-weight:700;word-break:break-all}
.final.fallback{color:var(--muted);font-weight:400}
/* tableau toujours visible, il prend la place qui reste */
.table{flex:1;min-height:9rem;display:flex;flex-direction:column;padding:0}
.table .head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.45rem .6rem;border-bottom:var(--b) solid var(--ink)}
.table .head b{text-transform:uppercase;letter-spacing:.06em;font-size:1.3rem}
.table .scroll{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:1.02rem}
th,td{padding:.32rem .55rem;border-bottom:1px solid rgba(26,26,26,.25);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--paper);border-bottom:2px solid var(--ink);font-size:1.12rem;text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;width:4.5rem;border-left:1px solid rgba(26,26,26,.25)}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--bg)}
tr.cur td{background:var(--ink);color:var(--paper)}
tr .unnamed{color:var(--muted)}
tr.cur .unnamed{color:#cfc6b3}
.saved{font-size:.75rem;color:var(--muted);min-height:1em}
.saved.err{color:var(--err)}
/* curseurs, cases à cocher et boutons radio en style pixel (repris de l'app de capture) */
input[type=range]{--p:50%;-webkit-appearance:none;appearance:none;width:100%;height:36px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:14px;border:var(--b) solid var(--ink);background:linear-gradient(90deg,var(--ink) 0 var(--p),var(--paper) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:28px;margin-top:-10px;border:var(--b) solid var(--ink);border-radius:0;background:var(--paper);box-shadow:var(--b) var(--b) 0 var(--ink)}
input[type=range]:active::-webkit-slider-thumb{background:var(--wait)}
input[type=range]::-moz-range-track{height:8px;border:var(--b) solid var(--ink);background:var(--paper)}
input[type=range]::-moz-range-progress{height:8px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:14px;height:22px;border:var(--b) solid var(--ink);border-radius:0;background:var(--paper);box-shadow:var(--b) var(--b) 0 var(--ink)}
input[type=range]:active::-moz-range-thumb{background:var(--wait)}
.check{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;min-height:36px}
/* cases à cocher et boutons radio en style pixel */
input[type=checkbox],input[type=radio]{-webkit-appearance:none;appearance:none;flex:none;width:24px;height:24px;margin:0 var(--b) var(--b) 0;
  border:var(--b) solid var(--ink);border-radius:0;background:var(--paper);box-shadow:var(--b) var(--b) 0 var(--ink);cursor:pointer;display:grid;place-content:center}
input[type=checkbox]:checked{background:var(--paper) url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%207%206%27%20shape-rendering%3D%27crispEdges%27%20fill%3D%27%231A1A1A%27%3E%3Crect%20x%3D%276%27%20y%3D%270%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%275%27%20y%3D%271%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%276%27%20y%3D%271%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%270%27%20y%3D%272%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%274%27%20y%3D%272%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%275%27%20y%3D%272%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%270%27%20y%3D%273%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%271%27%20y%3D%273%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%273%27%20y%3D%273%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%274%27%20y%3D%273%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%271%27%20y%3D%274%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%272%27%20y%3D%274%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%273%27%20y%3D%274%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%272%27%20y%3D%275%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3C%2Fsvg%3E") center/14px 12px no-repeat}
input[type=radio]::before{content:'';width:10px;height:10px;background:var(--ink);transform:scale(0)}
input[type=radio]:checked::before{transform:scale(1)}
input[type=checkbox]:active,input[type=radio]:active{transform:translate(var(--b),var(--b));box-shadow:none}

.check{display:flex;align-items:center;gap:.6rem;margin:.5rem 0;min-height:34px}
dialog.pix{border:5px solid var(--ink);background:var(--paper);color:var(--ink);padding:1rem 1.2rem;width:min(30rem,94vw);max-height:94vh;overflow:auto;box-shadow:8px 8px 0 var(--ink)}
dialog.pix::backdrop{background:rgba(26,26,26,.45)}
dialog.pix h2{margin:0 0 .6rem;font-size:1.55rem;text-transform:uppercase;letter-spacing:.06em}
dialog.pix .lbl{margin-top:.9rem}
dialog.pix .lbl span{font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:.4rem}
dialog.pix .row{display:flex;justify-content:flex-end;margin-top:1rem;padding:0 var(--b) var(--b) 0}
.choices{display:flex;flex-wrap:wrap;gap:.3rem 1.1rem}
.choice{display:flex;align-items:center;gap:.5rem;min-height:32px}
.swatches{display:flex;gap:.5rem;padding:0 var(--b) var(--b) 0}
.swatch{width:34px;height:34px;border:var(--b) solid var(--ink);box-shadow:var(--b) var(--b) 0 var(--ink);padding:0}
.swatch[aria-pressed="true"]{outline:var(--b) solid var(--ink);outline-offset:3px}
/* menu d'export du tableau */
.menuwrap{position:relative}
.menu{position:absolute;left:0;top:calc(100% + 8px);z-index:30;min-width:17rem;background:var(--paper);border:var(--b) solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:.25rem 0}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:.5rem .8rem;min-height:42px}
.menu button:hover:not([disabled]),.menu button:focus-visible{background:var(--bg);outline:none}
.menu button[disabled]{opacity:.4;cursor:default}
.menu .mhead{padding:.55rem .8rem .2rem;font-size:1.3rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);border-top:2px dashed var(--ink)}
.menu .mhead:first-child{border-top:0}
.chip.plus button{padding:.15rem .6rem;font-weight:700}
.toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.5rem 1rem;z-index:40;display:none;max-width:90vw;box-shadow:var(--b) var(--b) 0 var(--muted)}
.toast.show{display:block}
@media (max-height:640px){ .side{gap:.5rem} .card{padding:.45rem .6rem} }
</style>
</head>
<body>

<div class="main">
  <div class="top">
    <div class="brand"><h1>Petri·Count</h1><span class="ver" id="ver"></span></div>
    <span class="folder" id="folderName"></span>
    <button class="btn" id="btnFolder" type="button" data-i18n="chooseFolder"></button>
    <div class="menuwrap">
      <button class="btn" id="btnCsv" type="button" data-i18n="exportBtn" aria-haspopup="menu" aria-expanded="false" disabled></button>
      <div class="menu" id="csvMenu" role="menu" hidden>
        <div class="mhead" data-i18n="mCsv"></div>
        <button type="button" role="menuitem" id="csvHere" data-i18n="csvHere"></button>
        <button type="button" role="menuitem" id="csvElse" data-i18n="csvElse"></button>
        <div class="mhead" data-i18n="mPdf"></div>
        <button type="button" role="menuitem" id="pdfHere" data-i18n="csvHere"></button>
        <button type="button" role="menuitem" id="pdfElse" data-i18n="csvElse"></button>
      </div>
    </div>
    <button class="btn" id="btnSettings" type="button" data-i18n="settings"></button>
    <button class="flag" id="btnLang" type="button"></button>
  </div>
  <div class="stage"><div class="frame">
    <div class="screen" id="screen">
      <div class="pan" id="pan" hidden><img id="img" alt=""><svg id="marks" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="empty" id="empty">
        <p data-i18n="emptyIntro"></p>
        <div class="row">
          <button class="btn primary" id="btnFolder2" type="button" data-i18n="chooseFolder"></button>
          <button class="btn" id="btnReopen" type="button" hidden></button>
        </div>
        <p class="muted" id="browserNote"></p>
      </div>
      <div class="zoombar" id="zoombar" hidden>
        <button class="btn small" id="zOut" type="button" aria-label="−">−</button>
        <button class="btn small" id="zFit" type="button" data-i18n="fit"></button>
        <button class="btn small" id="zIn" type="button" aria-label="+">+</button>
      </div>
      <div class="zoomhint" id="zoomhint" hidden data-i18n="hint"></div>
    </div>
  </div></div>
  <div class="nav">
    <button class="btn" id="btnPrev" type="button" disabled>◀ <span data-i18n="prev"></span></button>
    <div class="file"><b id="fileName">–</b><span id="fileIdx"></span></div>
    <button class="btn" id="btnNext" type="button" disabled><span data-i18n="next"></span> ▶</button>
  </div>
</div>

<aside class="side">
  <div class="card counter">
    <button class="btn" id="btnUndo" type="button" data-i18n-aria="undo" disabled>↶</button>
    <div class="num"><b id="count">0</b><span>CFU</span></div>
    <button class="btn" id="btnRedo" type="button" data-i18n-aria="redo" disabled>↷</button>
  </div>
  <div class="card">
    <label class="lbl" for="inPrefix" data-i18n="prefix"></label>
    <div class="inline"><input type="text" id="inPrefix" autocomplete="off" data-i18n-ph="prefixPh">
      <button class="btn small" id="btnPrefixAll" type="button" data-i18n="applyAll"></button></div>
    <span class="lbl" data-i18n="group"></span>
    <div class="chips" id="chips"></div>
    <div class="inline" id="groupAdd" hidden><input type="text" id="inGroup" autocomplete="off" data-i18n-ph="groupPh">
      <button class="btn small" id="btnAddGroup" type="button" data-i18n="add"></button></div>
    <label class="lbl" for="inName" data-i18n="name"></label>
    <input type="text" id="inName" autocomplete="off" data-i18n-ph="namePh">
    <div class="final" id="finalName"></div>
  </div>
  <div class="card table">
    <div class="head"><b data-i18n="results"></b><span class="saved" id="saved"></span></div>
    <div class="scroll"><table><thead><tr><th data-i18n="colName"></th><th class="n">CFU</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</aside>

<dialog class="pix" id="setDlg">
  <h2 data-i18n="settings"></h2>
  <label class="lbl" for="sSize"><b data-i18n="markSize"></b><span id="vSize"></span></label>
  <input type="range" id="sSize" min="3" max="30" step="1">
  <span class="lbl" data-i18n="markColor"></span>
  <div class="swatches" id="swatches"></div>
  <label class="check"><input type="checkbox" id="cNum"> <span data-i18n="markNum"></span></label>
  <label class="check"><input type="checkbox" id="cKeepZoom"> <span data-i18n="keepZoom"></span></label>
  <span class="lbl" data-i18n="nameSep"></span>
  <div class="choices" id="sepChoices"></div>
  <span class="lbl" data-i18n="csvSep"></span>
  <div class="choices" id="csvSepChoices"></div>
  <span class="lbl" data-i18n="folderData"></span>
  <button class="btn danger" id="btnWipe" type="button" data-i18n="wipe"></button>
  <div class="row"><button class="btn primary" id="setClose" type="button" data-i18n="close"></button></div>
</dialog>

<dialog class="pix" id="askDlg">
  <h2 id="askTitle"></h2>
  <p id="askText"></p>
  <div id="askTypeBox" hidden>
    <label class="lbl" for="askType" id="askTypeLbl" style="text-transform:none;letter-spacing:0"></label>
    <input type="text" id="askType" autocomplete="off" spellcheck="false">
  </div>
  <div class="row" style="gap:.7rem"><button class="btn" id="askNo" type="button"></button><button class="btn primary" id="askYes" type="button"></button></div>
</dialog>

<dialog class="pix" id="pdfDlg">
  <form method="dialog" id="pdfForm">
    <h2 data-i18n="mPdf"></h2>
    <label class="lbl" for="inExp"><b data-i18n="expName"></b><span data-i18n="required"></span></label>
    <input type="text" id="inExp" autocomplete="off" required maxlength="120">
    <label class="lbl" for="inDesc"><b data-i18n="expDesc"></b><span data-i18n="optional"></span></label>
    <input type="text" id="inDesc" autocomplete="off" maxlength="200">
    <p class="muted" style="font-size:.8rem;margin:.6rem 0 0" data-i18n="pdfEnglish"></p>
    <div class="row" style="gap:.7rem">
      <button class="btn" type="button" id="pdfCancel" data-i18n="cancel"></button>
      <button class="btn primary" type="submit" id="pdfGo" data-i18n="create"></button>
    </div>
  </form>
</dialog>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const VERSION = 'v10 · 04/11';
const SAVE_FILE = 'petri-comptage.json';
const IMG_RE = /\.(jpe?g|png|webp|gif|bmp|avif)$/i;
const canWriteFolder = typeof window.showDirectoryPicker === 'function'; // Chrome, Edge : lecture et écriture dans le dossier
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};

/* ---------- Langues ---------- */
const I18N = {
  fr: {
    chooseFolder:'Choisir le dossier des photos', exportCsv:'Exporter (.csv)', prev:'Précédente', next:'Suivante', fit:'Ajuster',
    emptyIntro:"Choisissez le dossier qui contient les photos des boîtes. Les comptes sont enregistrés à chaque changement d'image.",
    reopen: p => 'Rouvrir « ' + p.n + ' »',
    noWrite:"Ce navigateur ne peut pas écrire dans le dossier : la sauvegarde reste dans le navigateur. Pour l'avoir dans le dossier, utilisez Chrome ou Edge.",
    hint:'Clic gauche : ajouter ou retirer une colonie · molette : zoom · clic droit maintenu : déplacer · ← → : image',
    undo:'Annuler', redo:'Rétablir', prefix:'Préfixe de la manip', prefixPh:'ex. : 2026-11-04_E.coli', applyAll:'Partout',
    group:'Groupe', groupPh:'Nouveau groupe…', add:'Ajouter', name:'Nom', namePh:'ex. : 10-3', results:'Résultats', colName:'Nom',
    noImages:"Aucune image trouvée dans ce dossier.", savedFolder:'Enregistré dans le dossier', savedLocal:'Enregistré dans le navigateur',
    saveErr:"Échec de l'enregistrement", csvDone: p => 'Tableau enregistré : ' + p.f, applied:'Préfixe appliqué à toutes les images comptées.',
    loaded: p => p.n + ' images, sauvegarde reprise.', found: p => p.n + ' images trouvées.', langSwitch:'Switch to English', permDenied:"Accès au dossier refusé.",
    csvHere:'Dans le dossier des images', csvElse:'Choisir un autre emplacement…', settings:'Réglages', close:'Fermer',
    exportBtn:'Exporter', mCsv:'Tableau (.csv)', mPdf:'Rapport (.pdf)', newGroup:'Nouveau groupe',
    expName:"Nom de l'expérience", expDesc:'Courte description', required:'obligatoire', optional:'facultatif', cancel:'Annuler', create:'Créer le rapport',
    pdfEnglish:'Le rapport est rédigé en anglais, pour pouvoir être transmis tel quel.',
    folderData:'Comptes de ce dossier', wipe:'Effacer tous les comptes de ce dossier',
    wipeTitle:'Tout effacer ?', wipeText: p => 'Les comptes, les noms et les groupes du dossier « ' + p.f + ' » seront supprimés (fichier ' + p.s + ' et copie du navigateur). Cette action est définitive : ils ne pourront pas être récupérés. Les photos ne sont pas touchées.',
    typeWord: p => 'Tapez « ' + p.w + ' » pour confirmer',

    restoreYes:'Reprendre la copie', restoreNo:'Repartir de zéro',
    pdfBusy: p => 'Création du rapport… ' + p.i + ' / ' + p.n, pdfDone: p => 'Rapport enregistré : ' + p.f, pdfNoLib:"Le module PDF n'a pas pu se charger (connexion ?).",
    markSize:'Taille des repères', markColor:'Couleur des repères', markNum:'Numéroter les repères', keepZoom:"Garder le zoom en changeant d'image",
    nameSep:'Séparateur du nom final', csvSep:'Séparateur du fichier CSV', space:'espace', csvSemi:'; (Excel en français)', csvComma:', (Excel en anglais)'
  },
  en: {
    chooseFolder:'Choose the photo folder', exportCsv:'Export (.csv)', prev:'Previous', next:'Next', fit:'Fit',
    emptyIntro:'Choose the folder that holds the dish photos. Counts are saved every time you change image.',
    reopen: p => 'Reopen “' + p.n + '”',
    noWrite:'This browser cannot write into the folder: the save stays in the browser. Use Chrome or Edge to keep it in the folder.',
    hint:'Left click: add or remove a colony · wheel: zoom · hold right click: move · ← →: image',
    undo:'Undo', redo:'Redo', prefix:'Experiment prefix', prefixPh:'e.g. 2026-11-04_E.coli', applyAll:'All',
    group:'Group', groupPh:'New group…', add:'Add', name:'Name', namePh:'e.g. 10-3', results:'Results', colName:'Name',
    noImages:'No images found in this folder.', savedFolder:'Saved in the folder', savedLocal:'Saved in the browser',
    saveErr:'Save failed', csvDone: p => 'Table saved: ' + p.f, applied:'Prefix applied to every counted image.',
    loaded: p => p.n + ' images, save restored.', found: p => p.n + ' images found.', langSwitch:'Passer en français', permDenied:'Folder access denied.',
    csvHere:'In the image folder', csvElse:'Choose another location…', settings:'Settings', close:'Close',
    exportBtn:'Export', mCsv:'Table (.csv)', mPdf:'Report (.pdf)', newGroup:'New group',
    expName:'Experiment name', expDesc:'Short description', required:'required', optional:'optional', cancel:'Cancel', create:'Create report',
    pdfEnglish:'The report is written in English so it can be shared as is.',
    folderData:'Counts for this folder', wipe:'Erase all counts for this folder',
    wipeTitle:'Erase everything?', wipeText: p => 'Counts, names and groups for the folder “' + p.f + '” will be deleted (' + p.s + ' file and browser copy). This cannot be undone: they cannot be recovered. The photos are not touched.',
    typeWord: p => 'Type “' + p.w + '” to confirm',
    wipeYes:'Erase', wiped:'Counts erased.', noFolder:'Choose a folder first.',
    restoreTitle:'Copy found in the browser', restoreText: p => 'The folder has no save file (' + p.s + '), but the browser kept a copy (' + p.n + ' image(s) counted). Restore it?',
    restoreYes:'Restore the copy', restoreNo:'Start from scratch',
    pdfBusy: p => 'Building the report… ' + p.i + ' / ' + p.n, pdfDone: p => 'Report saved: ' + p.f, pdfNoLib:'The PDF module could not load (offline?).',
    markSize:'Marker size', markColor:'Marker colour', markNum:'Number the markers', keepZoom:'Keep the zoom when changing image',
    nameSep:'Final name separator', csvSep:'CSV separator', space:'space', csvSemi:'; (Excel in French)', csvComma:', (Excel in English)'
  }
};
const appSettings = store.get('petri.settings', {});
let lang = I18N[appSettings.lang] ? appSettings.lang : (navigator.language || '').startsWith('fr') ? 'fr' : 'en';
const t = (k, p) => { const v = I18N[lang][k] !== undefined ? I18N[lang][k] : I18N.en[k]; return typeof v === 'function' ? v(p || {}) : v; };
function flagSvg(code){ // drapeaux en pixel art, comme dans l'app de capture
  const px = [];
  for (let y = 0; y < 10; y++) for (let x = 0; x < 16; x++){
    let c;
    if (code === 'fr') c = x < 5 ? '#1F3A93' : x < 11 ? '#FFFFFF' : '#D2452F';
    else {
      const dx = x - 7.5, dy = y - 4.5, d1 = Math.abs(dy - dx*10/16), d2 = Math.abs(dy + dx*10/16);
      c = '#1F3A93';
      if (d1 < 1.2 || d2 < 1.2) c = '#FFFFFF';
      if (d1 < .5 || d2 < .5) c = '#D2452F';
      if (Math.abs(dx) < 2 || Math.abs(dy) < 2) c = '#FFFFFF';
      if (Math.abs(dx) < 1 || Math.abs(dy) < 1) c = '#D2452F';
    }
    px.push('<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + c + '"/>');
  }
  return '<svg viewBox="0 0 16 10" aria-hidden="true">' + px.join('') + '</svg>';
}
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', t(e.dataset.i18nAria)); e.title = t(e.dataset.i18nAria); });
  document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh); });
  $('btnLang').innerHTML = flagSvg(lang); $('btnLang').title = t('langSwitch'); $('btnLang').setAttribute('aria-label', t('langSwitch'));
  $('browserNote').textContent = canWriteFolder ? '' : t('noWrite');
  updateReopen(); renderSaved(); renderTable();
  if ($('setDlg').open) buildSettings();
}
$('btnLang').addEventListener('click', () => {
  lang = lang === 'fr' ? 'en' : 'fr';
  const s = store.get('petri.settings', {}); s.lang = lang; store.set('petri.settings', s); // même choix que l'app de capture
  applyLang();
});
$('ver').textContent = VERSION;

/* ---------- Réglages (gardés dans le navigateur) ---------- */
const COLORS = ['#F2C14E', '#FF4F4F', '#3FD0E0', '#5BD65B', '#FF5FD2', '#FFFFFF'];
const S = Object.assign({ size:9, color:COLORS[0], num:false, keepZoom:false, sep:'_', csvSep:';' }, store.get('petri.count.settings', {}));
const saveS = () => { store.set('petri.count.settings', S); renderAll(); };
function buildSettings(){
  const r = $('sSize'); r.value = S.size; $('vSize').textContent = S.size + ' px';
  r.style.setProperty('--p', ((S.size - r.min) / (r.max - r.min) * 100) + '%');
  $('swatches').innerHTML = '';
  COLORS.forEach(c => { const b = document.createElement('button'); b.type = 'button'; b.className = 'swatch'; b.style.background = c; b.setAttribute('aria-label', c);
    b.setAttribute('aria-pressed', String(S.color === c)); b.addEventListener('click', () => { S.color = c; saveS(); buildSettings(); }); $('swatches').appendChild(b); });
  $('cNum').checked = S.num; $('cKeepZoom').checked = S.keepZoom;
  const radios = (box, name, opts, key) => { $(box).innerHTML = '';
    opts.forEach(([v, label]) => { const l = document.createElement('label'); l.className = 'choice';
      const i = document.createElement('input'); i.type = 'radio'; i.name = name; i.checked = S[key] === v;
      i.addEventListener('change', () => { S[key] = v; saveS(); });
      l.append(i, document.createTextNode(label)); $(box).appendChild(l); }); };
  radios('sepChoices', 'sep', [['_', '_'], ['-', '-'], [' ', t('space')], ['.', '.']], 'sep');
  radios('csvSepChoices', 'csvsep', [[';', t('csvSemi')], [',', t('csvComma')]], 'csvSep');
}
$('sSize').addEventListener('input', e => { S.size = +e.target.value; buildSettings(); saveS(); });
$('cNum').addEventListener('change', e => { S.num = e.target.checked; saveS(); });
$('cKeepZoom').addEventListener('change', e => { S.keepZoom = e.target.checked; saveS(); });
$('btnSettings').addEventListener('click', () => { buildSettings(); $('setDlg').showModal(); });
$('setClose').addEventListener('click', () => $('setDlg').close());
$('btnWipe').addEventListener('click', async () => {
  if (!folder){ toast(t('noFolder')); return; }
  if (!(await ask(t('wipeTitle'), t('wipeText', { f:folder, s:SAVE_FILE }), t('wipeYes'), t('cancel'), 'erase'))) return;
  clearTimeout(saveTimer); await saving;
  try{ localStorage.removeItem(localKey()); }catch(e){}
  if (dir){ try{ await dir.removeEntry(SAVE_FILE); }catch(e){} }
  const keepIdx = Math.max(0, idx);
  data = blank(); lastPrefix = lastGroup = ''; for (const k in hist) delete hist[k];
  idx = -1; $('setDlg').close(); toast(t('wiped'));
  if (files.length) await show(keepIdx);
});

// question avec deux réponses, dans le style du site ; résout à vrai pour « oui ».
// word : mot à taper pour pouvoir confirmer (actions définitives)
function ask(title, text, yes, no, word){
  return new Promise(res => {
    const d = $('askDlg'); $('askTitle').textContent = title; $('askText').textContent = text; $('askYes').textContent = yes; $('askNo').textContent = no;
    const box = $('askTypeBox'), inp = $('askType'), yesB = $('askYes');
    box.hidden = !word; inp.value = ''; yesB.disabled = !!word;
    yesB.className = 'btn ' + (word ? 'danger' : 'primary'); // action définitive : bouton rouge
    if (word){ $('askTypeLbl').textContent = t('typeWord', { w:word }); inp.oninput = () => { yesB.disabled = inp.value.trim().toLowerCase() !== word; };
      inp.onkeydown = e => { if (e.key === 'Enter' && !yesB.disabled){ e.preventDefault(); yesB.click(); } }; }
    const done = v => { $('askYes').onclick = $('askNo').onclick = d.oncancel = inp.oninput = inp.onkeydown = null; d.close(); res(v); };
    $('askYes').onclick = () => done(true); $('askNo').onclick = () => done(false); d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal(); if (word) inp.focus();
  });
}

// dossier en pixel art (13 × 11) : contour noir, intérieur jaune comme les repères
const FOLDER_SVG = (() => {
  const rows = ['.####........', '#mmmm#.......', '#mmmmm######.', '#############', '#yyyyyyyyyyy#', '#yyyyyyyyyyy#', '#yyyyyyyyyyy#', '#yyyyyyyyyyy#', '#yyyyyyyyyyy#', '#############'];
  const col = { '#':'#1A1A1A', m:'#D9A93A', y:'#F2C14E' };
  return '<svg viewBox="0 0 13 10" aria-hidden="true">' + rows.map((r, y) => [...r].map((ch, x) => col[ch] ? '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + col[ch] + '"/>' : '').join('')).join('') + '</svg>';
})();

let toastT = null;
function toast(msg){ const e = $('toast'); e.textContent = msg; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 3200); }

/* ---------- Données ----------
   Une sauvegarde par dossier (petri-comptage.json dans le dossier, et une copie dans le navigateur) :
   { version, prefix, group, groups:[…], images:{ fichier:{ prefix, group, name, marks:[[x, y], …] } } }
   x et y sont en fractions de la largeur et de la hauteur de l'image. */
let dir = null, folder = '', files = [], idx = -1;
let data = blank();
let lastPrefix = '', lastGroup = '';  // reportés sur chaque nouvelle image tant qu'on ne les change pas
const hist = {};                      // annuler / rétablir, par image : { undo:[…], redo:[…] }
function blank(){ return { version:1, prefix:'', group:'', groups:[], images:{} }; }
const localKey = () => 'petri.count.' + folder;
const curName = () => idx >= 0 ? files[idx].name : null;
const rec = () => idx >= 0 ? data.images[curName()] : null;
const stem = f => f.replace(/\.[^.]+$/, '');
function finalName(r){ return r ? [r.prefix, r.group, r.name].map(s => (s || '').trim()).filter(Boolean).join(S.sep) : ''; }

/* ---------- Dossier ---------- */
async function chooseFolder(){
  if (canWriteFolder){
    try{ const h = await window.showDirectoryPicker({ id:'petri-count', mode:'readwrite' }); await openDir(h); saveHandle(h); }
    catch(e){ if (e && e.name !== 'AbortError') toast(t('permDenied')); }
  } else $('dirInput').click();
}
$('btnFolder').addEventListener('click', chooseFolder);
$('btnFolder2').addEventListener('click', chooseFolder);
async function openDir(h){
  const list = []; let saved = null;
  for await (const [name, entry] of h.entries()){
    if (entry.kind !== 'file') continue;
    if (IMG_RE.test(name)) list.push({ name, handle:entry });
    else if (name === SAVE_FILE){ try{ saved = JSON.parse(await (await entry.getFile()).text()); }catch(e){} }
  }
  dir = h; await load(h.name, list, saved);
}
// navigateurs sans accès en écriture : on lit le dossier choisi, la sauvegarde reste dans le navigateur
$('dirInput').addEventListener('change', async e => {
  const all = [...e.target.files]; if (!all.length) return;
  const name = (all[0].webkitRelativePath || '').split('/')[0] || 'dossier';
  const top = all.filter(f => (f.webkitRelativePath || f.name).split('/').length <= 2); // fichiers du dossier lui-même
  let saved = null; const sf = top.find(f => f.name === SAVE_FILE);
  if (sf){ try{ saved = JSON.parse(await sf.text()); }catch(err){} }
  dir = null; await load(name, top.filter(f => IMG_RE.test(f.name)).map(f => ({ name:f.name, file:f })), saved);
  e.target.value = '';
});
async function load(name, list, saved){
  folder = name;
  files = list.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric:true, sensitivity:'base' }));
  // La sauvegarde du dossier fait foi. Si elle manque alors que le navigateur en garde une copie :
  // dossier accessible en écriture → on demande (le fichier a peut-être été supprimé exprès) ;
  // sinon (Firefox, Safari) la copie du navigateur est la seule sauvegarde → reprise directe.
  let local = store.get(localKey(), null);
  if (!(saved && saved.images) && local && local.images && dir && Object.keys(local.images).length){
    const n = Object.values(local.images).filter(r => r.marks && r.marks.length).length;
    if (!(await ask(t('restoreTitle'), t('restoreText', { s:SAVE_FILE, n }), t('restoreYes'), t('restoreNo')))){ try{ localStorage.removeItem(localKey()); }catch(e){} local = null; }
  }
  data = Object.assign(blank(), saved && saved.images ? saved : local && local.images ? local : {});
  lastPrefix = data.prefix || ''; lastGroup = data.group || '';
  for (const k in hist) delete hist[k];
  $('folderName').innerHTML = FOLDER_SVG; const fn = document.createElement('span'); fn.textContent = folder; $('folderName').appendChild(fn);
  $('btnCsv').disabled = !files.length;
  if (!files.length){ toast(t('noImages')); showEmpty(true); renderTable(); return; }
  toast(saved || local ? t('loaded', { n:files.length }) : t('found', { n:files.length }));
  // reprend à la première image pas encore comptée
  const first = files.findIndex(f => !data.images[f.name]);
  await show(first < 0 ? 0 : first);
}
// dossier rouvrable au prochain lancement (Chrome, Edge) : le lien vers le dossier est gardé dans IndexedDB
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('petri-count', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function saveHandle(h){ try{ const d = await idb(); d.transaction('kv', 'readwrite').objectStore('kv').put(h, 'dir'); }catch(e){} }
async function loadHandle(){ try{ const d = await idb(); return await new Promise(res => { const q = d.transaction('kv').objectStore('kv').get('dir'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); }catch(e){ return null; } }
let savedHandle = null;
function updateReopen(){ const b = $('btnReopen'); b.hidden = !savedHandle || !!dir; if (savedHandle) b.textContent = t('reopen', { n:savedHandle.name }); }
$('btnReopen').addEventListener('click', async () => {
  try{
    if ((await savedHandle.requestPermission({ mode:'readwrite' })) !== 'granted'){ toast(t('permDenied')); return; }
    await openDir(savedHandle); updateReopen();
  }catch(e){ toast(t('permDenied')); }
});
if (canWriteFolder) loadHandle().then(h => { savedHandle = h; updateReopen(); });

/* ---------- Enregistrement ---------- */
let saveState = '', saveTimer = null, saving = Promise.resolve();
function renderSaved(){ const e = $('saved'); e.textContent = saveState ? t(saveState) : ''; e.classList.toggle('err', saveState === 'saveErr'); }
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 500); }
function saveNow(){
  clearTimeout(saveTimer);
  if (!folder) return saving;
  data.prefix = lastPrefix; data.group = lastGroup;
  const json = JSON.stringify(data, null, 1);
  saving = saving.then(async () => {
    const okLocal = store.set(localKey(), data);
    if (dir){
      try{ const fh = await dir.getFileHandle(SAVE_FILE, { create:true }), w = await fh.createWritable(); await w.write(json); await w.close(); saveState = 'savedFolder'; }
      catch(e){ saveState = okLocal ? 'savedLocal' : 'saveErr'; }
    } else saveState = okLocal ? 'savedLocal' : 'saveErr';
    renderSaved();
  });
  return saving;
}
window.addEventListener('beforeunload', () => { store.set(localKey(), data); });

/* ---------- Image courante ---------- */
let url = null, natW = 1, natH = 1;
function showEmpty(on){ $('empty').hidden = !on; $('pan').hidden = on; $('zoombar').hidden = on; $('zoomhint').hidden = on; }
async function show(i){
  if (!files.length) return;
  if (idx >= 0) await saveNow(); // tout est enregistré avant de quitter l'image
  idx = Math.max(0, Math.min(files.length - 1, i));
  const f = files[idx];
  // nouvelle image : préfixe et groupe repris, nom vidé
  if (!data.images[f.name]) data.images[f.name] = { prefix:lastPrefix, group:lastGroup, name:'', marks:[] };
  const r = rec();
  $('inPrefix').value = r.prefix; $('inName').value = r.name; // revoir une image ne change pas ce qui est reporté sur les suivantes
  const file = f.file || await f.handle.getFile();
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(file);
  const img = $('img');
  await new Promise(res => { img.onload = res; img.onerror = res; img.src = url; });
  const sameSize = natW === img.naturalWidth && natH === img.naturalHeight;
  natW = img.naturalWidth || 1; natH = img.naturalHeight || 1;
  $('marks').setAttribute('viewBox', '0 0 ' + natW + ' ' + natH);
  showEmpty(false);
  if (S.keepZoom && sameSize && zoom > 1) applyView(); else fit(); // même zone sur l'image suivante
  $('fileName').textContent = f.name; $('fileIdx').textContent = (idx + 1) + ' / ' + files.length;
  $('btnPrev').disabled = idx === 0; $('btnNext').disabled = idx === files.length - 1;
  renderAll(); scheduleSave();
  const row = document.querySelector('#rows tr.cur'); if (row) row.scrollIntoView({ block:'nearest' });
}
$('btnPrev').addEventListener('click', () => show(idx - 1));
$('btnNext').addEventListener('click', () => show(idx + 1));

/* ---------- Zoom et déplacement ---------- */
let base = 1, zoom = 1, tx = 0, ty = 0;
function fit(){
  const s = $('screen'), sw = s.clientWidth, sh = s.clientHeight;
  base = Math.min(sw / natW, sh / natH); zoom = 1;
  tx = (sw - natW*base) / 2; ty = (sh - natH*base) / 2; applyView();
}
function applyView(){
  const p = $('pan'); p.style.width = natW*base + 'px'; p.style.height = natH*base + 'px';
  p.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + zoom + ')';
  renderMarks();
}
function zoomAt(f, cx, cy){
  const nz = Math.min(16, Math.max(1, zoom * f)), k = nz / zoom;
  tx = cx - (cx - tx)*k; ty = cy - (cy - ty)*k; zoom = nz;
  if (zoom === 1) fit(); else applyView();
}
const screenEl = $('screen');
screenEl.addEventListener('wheel', e => {
  if (idx < 0) return; e.preventDefault();
  const b = screenEl.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * .0015), e.clientX - b.left, e.clientY - b.top);
}, { passive:false });
$('zIn').addEventListener('click', () => zoomAt(1.5, screenEl.clientWidth/2, screenEl.clientHeight/2));
$('zOut').addEventListener('click', () => zoomAt(1/1.5, screenEl.clientWidth/2, screenEl.clientHeight/2));
$('zFit').addEventListener('click', fit);
window.addEventListener('resize', () => { if (idx >= 0) fit(); });
// clic gauche : compter (un clic qui a glissé de plus de 6 px est ignoré) ; clic droit maintenu : déplacer l'image ;
// au doigt (écran tactile) : toucher pour compter, glisser pour déplacer
let drag = null;
screenEl.addEventListener('pointerdown', e => {
  if (idx < 0 || e.target.closest('.zoombar, .empty')) return;
  if (e.button !== 0 && e.button !== 2) return;
  drag = { id:e.pointerId, x:e.clientX, y:e.clientY, tx, ty, moved:false, pan: e.button === 2 || e.pointerType === 'touch', count: e.button === 0 };
  screenEl.setPointerCapture(e.pointerId);
});
screenEl.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 6){ drag.moved = true; if (drag.pan) screenEl.classList.add('panning'); }
  if (drag.moved && drag.pan){ tx = drag.tx + dx; ty = drag.ty + dy; applyView(); }
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null; screenEl.classList.remove('panning');
  if (!d.moved && d.count && e.type === 'pointerup') clickAt(e.clientX, e.clientY);
};
screenEl.addEventListener('pointerup', endDrag); screenEl.addEventListener('pointercancel', endDrag);
screenEl.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- Comptage ---------- */
const H = () => hist[curName()] || (hist[curName()] = { undo:[], redo:[] });
function clickAt(cx, cy){
  const b = screenEl.getBoundingClientRect(), s = base*zoom;
  const x = (cx - b.left - tx) / s, y = (cy - b.top - ty) / s; // pixels de l'image
  if (x < 0 || y < 0 || x > natW || y > natH) return;
  const r = rec(), tol = Math.max(12, S.size + 3) / s; // un clic sur un repère (ou tout près) le retire
  let hit = -1, best = Infinity;
  r.marks.forEach((m, i) => { const d = Math.hypot(m[0]*natW - x, m[1]*natH - y); if (d < tol && d < best){ best = d; hit = i; } });
  if (hit >= 0) apply({ op:'del', i:hit, m:r.marks[hit] });
  else apply({ op:'add', i:r.marks.length, m:[x / natW, y / natH] });
}
function doOp(a, reverse){
  const r = rec(), add = (a.op === 'add') !== !!reverse;
  if (add) r.marks.splice(a.i, 0, a.m); else r.marks.splice(a.i, 1);
}
function apply(a){ doOp(a); const h = H(); h.undo.push(a); h.redo = []; changed(); }
function undo(){ const h = H(), a = h.undo.pop(); if (!a) return; doOp(a, true); h.redo.push(a); changed(); }
function redo(){ const h = H(), a = h.redo.pop(); if (!a) return; doOp(a); h.undo.push(a); changed(); }
$('btnUndo').addEventListener('click', undo);
$('btnRedo').addEventListener('click', redo);
function changed(){ renderAll(); scheduleSave(); }

/* ---------- Nom de la condition ---------- */
$('inPrefix').addEventListener('input', e => { const r = rec(); if (!r) return; r.prefix = lastPrefix = e.target.value; changed(); });
$('inName').addEventListener('input', e => { const r = rec(); if (!r) return; r.name = e.target.value; changed(); });
$('btnPrefixAll').addEventListener('click', () => {
  if (idx < 0) return;
  for (const k in data.images) data.images[k].prefix = lastPrefix;
  changed(); toast(t('applied'));
});
function addGroup(){
  const v = $('inGroup').value.trim(); if (!v) return;
  if (!data.groups.includes(v)) data.groups.push(v);
  showGroupAdd(false);
  const r = rec(); if (r){ r.group = lastGroup = v; }
  changed();
}
function showGroupAdd(on){ $('groupAdd').hidden = !on; if (on) $('inGroup').focus(); else $('inGroup').value = ''; }
$('btnAddGroup').addEventListener('click', addGroup);
$('inGroup').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); addGroup(); }
  else if (e.key === 'Escape'){ e.preventDefault(); showGroupAdd(false); }
});
$('inGroup').addEventListener('blur', () => setTimeout(() => { if (!$('inGroup').value.trim() && document.activeElement !== $('btnAddGroup')) showGroupAdd(false); }, 150));
function renderChips(){
  const box = $('chips'), r = rec(); box.innerHTML = '';
  data.groups.forEach(g => {
    const c = document.createElement('span'); c.className = 'chip'; c.setAttribute('aria-pressed', String(!!r && r.group === g));
    const b = document.createElement('button'); b.type = 'button';
    const tick = document.createElement('span'); tick.className = 'tick'; tick.setAttribute('aria-hidden', 'true'); b.append(tick, document.createTextNode(g));
    b.addEventListener('click', () => { const r2 = rec(); if (!r2) return; r2.group = lastGroup = r2.group === g ? '' : g; changed(); }); // re-cliquer : aucun groupe
    const x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', '× ' + g);
    x.addEventListener('click', () => { data.groups = data.groups.filter(v => v !== g); if (lastGroup === g) lastGroup = ''; changed(); }); // les images déjà nommées gardent leur groupe
    c.append(b, x); box.appendChild(c);
  });
  // « + » en fin de liste : fait apparaître le champ pour un nouveau groupe
  const plus = document.createElement('span'); plus.className = 'chip plus';
  const pb = document.createElement('button'); pb.type = 'button'; pb.textContent = '+'; pb.setAttribute('aria-label', t('newGroup')); pb.title = t('newGroup');
  pb.addEventListener('click', () => showGroupAdd($('groupAdd').hidden));
  plus.appendChild(pb); box.appendChild(plus);
}

/* ---------- Affichage ---------- */
function renderMarks(){
  const r = rec(), svg = $('marks'); if (!r){ svg.innerHTML = ''; return; }
  const s = base*zoom, rad = S.size / s, w = 2.5 / s, fs = 18 / s; // taille constante à l'écran, quel que soit le zoom
  svg.innerHTML = r.marks.map((m, i) => { const x = (m[0]*natW).toFixed(1), y = (m[1]*natH).toFixed(1);
    return '<circle cx="' + x + '" cy="' + y + '" r="' + rad + '" fill="none" stroke="#1A1A1A" stroke-width="' + (w*2.2) + '"/>' +
      '<circle cx="' + x + '" cy="' + y + '" r="' + rad + '" fill="none" stroke="' + S.color + '" stroke-width="' + w + '"/>' +
      (S.num ? '<text x="' + (+x + rad + 2/s) + '" y="' + (+y - rad) + '" font-size="' + fs + '" font-family="Pixelify Sans, monospace" fill="' + S.color + '" stroke="#1A1A1A" stroke-width="' + (1.6/s) + '" paint-order="stroke" font-weight="700">' + (i + 1) + '</text>' : ''); }).join('');
}
function renderTable(){
  const tb = $('rows'); if (!tb) return;
  tb.innerHTML = '';
  files.forEach((f, i) => {
    const r = data.images[f.name], tr = document.createElement('tr');
    tr.className = 'row' + (i === idx ? ' cur' : '');
    const name = finalName(r), td1 = document.createElement('td'), td2 = document.createElement('td');
    if (name) td1.textContent = name; else { td1.textContent = stem(f.name); td1.className = 'unnamed'; }
    td2.className = 'n'; td2.textContent = r ? r.marks.length : '–';
    tr.append(td1, td2); tr.addEventListener('click', () => show(i)); tb.appendChild(tr);
  });
}
function renderAll(){
  const r = rec();
  $('count').textContent = r ? r.marks.length : 0;
  const h = r ? H() : { undo:[], redo:[] };
  $('btnUndo').disabled = !h.undo.length; $('btnRedo').disabled = !h.redo.length;
  const fn = finalName(r), fe = $('finalName');
  fe.textContent = fn || (idx >= 0 ? stem(curName()) : '–'); fe.classList.toggle('fallback', !fn);
  renderChips(); renderMarks(); renderTable();
}

/* ---------- Export ---------- */
function csvText(){
  const sep = S.csvSep, q = v => (v.includes(sep) || /["\n]/.test(v)) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const lines = [[t('colName'), 'CFU', 'Image'].join(sep)];
  files.forEach(f => { const r = data.images[f.name]; if (r) lines.push([q(finalName(r) || stem(f.name)), r.marks.length, q(f.name)].join(sep)); });
  return '\ufeff' + lines.join('\r\n') + '\r\n'; // BOM : les accents s'affichent correctement dans Excel
}
const csvName = () => 'comptage_' + folder.replace(/[^\w.-]+/g, '_') + '.csv';
async function writeTo(fh, text){ const w = await fh.createWritable(); await w.write(text); await w.close(); }
function openMenu(on){ $('csvMenu').hidden = !on; $('btnCsv').setAttribute('aria-expanded', String(on)); if (on) $('csvHere').disabled = $('pdfHere').disabled = !dir; }
// Où enregistrer : dossier des images (here), fenêtre « Enregistrer sous » (Chrome, Edge), sinon téléchargement.
// La fenêtre doit s'ouvrir juste après le clic : on choisit donc l'emplacement avant de préparer le contenu.
async function pickTarget(fname, mime, ext, here){
  if (here) return { fh: await dir.getFileHandle(fname, { create:true }), name:fname };
  if (typeof window.showSaveFilePicker === 'function'){
    try{
      const fh = await window.showSaveFilePicker({ suggestedName:fname, startIn: dir || 'documents', types:[{ description:ext.toUpperCase(), accept:{ [mime]:['.' + ext] } }] });
      return { fh, name:fh.name };
    }catch(e){ if (e && e.name === 'AbortError') return null; }
  }
  return { name:fname, mime };
}
async function writeTarget(tg, content){
  if (tg.fh){ await writeTo(tg.fh, content); return tg.name; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(content instanceof Blob ? content : new Blob([content], { type:tg.mime })); a.download = tg.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 20000);
  return tg.name;
}
$('btnCsv').addEventListener('click', e => { e.stopPropagation(); openMenu($('csvMenu').hidden); });
document.addEventListener('click', e => { if (!e.target.closest('.menuwrap')) openMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') openMenu(false); });
async function exportCsv(here){
  openMenu(false); await saveNow();
  try{ const tg = await pickTarget(csvName(), 'text/csv', 'csv', here); if (tg) toast(t('csvDone', { f: await writeTarget(tg, csvText()) })); }
  catch(e){ toast(t('saveErr')); }
}
$('csvHere').addEventListener('click', () => exportCsv(true));
$('csvElse').addEventListener('click', () => exportCsv(false));

/* Rapport PDF, volontairement sobre (Helvetica, noir et blanc) pour être transmis tel quel :
   deux images par page A4, chacune entière avec ses repères (sans numéros), suivie d'un tableau Nom / CFU. */
async function reportImage(f, r){
  const file = f.file || await f.handle.getFile(), u = URL.createObjectURL(file);
  try{
    const img = new Image(); await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = u; });
    const k = Math.min(1, 2000 / img.naturalWidth), w = Math.round(img.naturalWidth*k), h = Math.round(img.naturalHeight*k);
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
    x.drawImage(img, 0, 0, w, h);
    const rad = Math.max(5, w * .008), lw = Math.max(1.5, w * .0022);
    r.marks.forEach(([mx, my]) => {
      x.beginPath(); x.arc(mx*w, my*h, rad, 0, 2*Math.PI); x.lineWidth = lw*2.4; x.strokeStyle = '#000'; x.stroke();
      x.beginPath(); x.arc(mx*w, my*h, rad, 0, 2*Math.PI); x.lineWidth = lw; x.strokeStyle = S.color; x.stroke();
    });
    return { url:c.toDataURL('image/jpeg', .88), w, h };
  } finally { URL.revokeObjectURL(u); }
}
// le rapport est toujours rédigé en anglais, quelle que soit la langue de la page
async function buildReport(exp, desc){
  const { jsPDF } = window.jspdf, doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
  const PW = 210, PH = 297, M = 15, CW = PW - 2*M, items = files.filter(f => data.images[f.name]);
  const date = new Date().toLocaleDateString('en-GB', { year:'numeric', month:'long', day:'numeric' });
  const header = () => {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(0);
    doc.text(doc.splitTextToSize('Count report: ' + exp, CW - 45)[0], M, 12);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90);
    if (desc) doc.text(doc.splitTextToSize(desc, CW)[0], M, 17);
    doc.text(date, PW - M, 12, { align:'right' });
    doc.setDrawColor(160); doc.setLineWidth(.2); doc.line(M, 20, PW - M, 20);
  };
  header();
  let y = 26, n = 0;
  for (const f of items){
    toast(t('pdfBusy', { i:++n, n:items.length }));
    const r = data.images[f.name], im = await reportImage(f, r);
    let iw = CW, ih = CW * im.h / im.w; if (ih > 100){ ih = 100; iw = ih * im.w / im.h; }
    const blockH = ih + 6 + 16;
    if (y + blockH > PH - 14){ doc.addPage(); header(); y = 26; }
    doc.addImage(im.url, 'JPEG', M + (CW - iw)/2, y, iw, ih);
    y += ih + 4;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(110);
    doc.text('Image: ' + f.name, M, y); y += 2;
    // tableau 2 × 2 : en-têtes, puis le nom et le nombre de colonies
    const c1 = CW - 35, rh = 7;
    doc.setDrawColor(0); doc.setLineWidth(.25); doc.setFillColor(235, 235, 235);
    doc.rect(M, y, CW, rh, 'FD'); doc.rect(M, y + rh, CW, rh); doc.line(M + c1, y, M + c1, y + 2*rh);
    doc.setTextColor(0); doc.setFontSize(10); doc.setFont('helvetica', 'bold');
    doc.text('Name', M + 2, y + 4.8); doc.text('CFU', M + CW - 2, y + 4.8, { align:'right' });
    doc.setFont('helvetica', 'normal');
    const name = doc.splitTextToSize(finalName(r) || stem(f.name), c1 - 4)[0];
    doc.text(name, M + 2, y + rh + 4.8); doc.text(String(r.marks.length), M + CW - 2, y + rh + 4.8, { align:'right' });
    y += 2*rh + 10;
  }
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++){
    doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(110);
    doc.text('Page ' + i + ' / ' + pages, M, PH - 8);
    doc.text('Captured using Petri-Scanner and counted using Petri-Counter', PW - M, PH - 8, { align:'right' });
  }
  return doc.output('blob');
}
// clic sur « Rapport » : fenêtre pour le nom de l'expérience (obligatoire) et une courte description
let pdfHereTarget = false;
function askPdf(here){
  openMenu(false);
  if (!window.jspdf){ toast(t('pdfNoLib')); return; }
  pdfHereTarget = here;
  const rp = data.report || {}; $('inExp').value = rp.name || ''; $('inDesc').value = rp.desc || '';
  $('pdfDlg').showModal(); $('inExp').focus();
}
$('pdfHere').addEventListener('click', () => askPdf(true));
$('pdfElse').addEventListener('click', () => askPdf(false));
$('pdfCancel').addEventListener('click', () => $('pdfDlg').close());
$('pdfForm').addEventListener('submit', async e => {
  e.preventDefault();
  const exp = $('inExp').value.trim(), desc = $('inDesc').value.trim();
  if (!exp){ $('inExp').focus(); return; }
  $('pdfDlg').close();
  data.report = { name:exp, desc }; // repris la prochaine fois pour ce dossier
  try{
    // REPORT-AAAA-MM-JJ-nom de l'expérience.pdf (accents retirés, caractères interdits dans un nom de fichier remplacés)
    const d = new Date(), day = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const safe = exp.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.-]+/g, '_').replace(/^_+|_+$/g, '');
    const tg = await pickTarget('REPORT-' + day + '-' + safe + '.pdf', 'application/pdf', 'pdf', pdfHereTarget);
    if (!tg) return;
    await saveNow();
    toast(t('pdfDone', { f: await writeTarget(tg, await buildReport(exp, desc)) }));
  }catch(err){ toast(t('saveErr')); }
});

/* ---------- Clavier ---------- */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z' && !typing){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y' && !typing){ e.preventDefault(); redo(); return; }
  if (typing){ if (e.key === 'Enter' && document.activeElement.id !== 'inGroup') document.activeElement.blur(); return; }
  if (e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); if (idx < files.length - 1) show(idx + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); if (idx > 0) show(idx - 1); }
  else if (e.key === '0') fit();
});

showEmpty(true);
applyLang();
})();
</script>
