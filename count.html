<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petri dish counting</title>
<meta name="theme-color" content="#EFE6D2">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@font-face{font-family:"ByteBounce";src:url("fonts/ByteBounce.ttf") format("truetype");font-display:swap}
/* Même style que l'app de capture : fond beige, encre noire, police pixelisée */
:root{
  --bg:#EFE6D2; --paper:#F8F2E4; --ink:#1A1A1A; --muted:#5E5546;
  --ok:#3A9A5B; --err:#D2452F; --viewer:#111; --dish:#F2C14E;
  --b:3px; --side:clamp(19rem,27vw,25rem);
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"ByteBounce","Pixelify Sans",ui-monospace,"Courier New",monospace;font-size:19px;line-height:1.35;
  display:grid;grid-template-columns:1fr var(--side);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:var(--b) dashed var(--ink);outline-offset:3px}
.btn{
  border:var(--b) solid var(--ink);background:var(--paper);border-radius:0;
  padding:.3rem .8rem;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  box-shadow:var(--b) var(--b) 0 var(--ink);font-weight:600;
}
.btn:active:not([disabled]){transform:translate(var(--b),var(--b));box-shadow:none}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.danger{color:var(--err);border-color:var(--err);box-shadow:var(--b) var(--b) 0 var(--err)}
.btn.small{min-height:32px;padding:.1rem .5rem;font-size:.85rem}
.flag{padding:3px;min-height:0;border:var(--b) solid var(--ink);background:var(--paper);box-shadow:var(--b) var(--b) 0 var(--ink);line-height:0;cursor:pointer}
.flag:active{transform:translate(var(--b),var(--b));box-shadow:none}
.flag svg{width:32px;height:20px;display:block;shape-rendering:crispEdges}
input[type=text]{width:100%;min-height:40px;border:var(--b) solid var(--ink);border-radius:0;background:var(--paper);padding:0 .55rem;margin:0 var(--b) var(--b) 0;box-shadow:var(--b) var(--b) 0 var(--ink)}
input[type=text]:focus{outline:none;background:#fff}
.muted{color:var(--muted)}

/* ---------- Colonne principale : en-tête, image, navigation ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:.7rem .6rem .8rem 1rem;gap:.6rem}
.top{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding:0 var(--b) var(--b) 0}
.brand{display:flex;flex-direction:column;margin-right:auto;white-space:nowrap}
.brand h1{font-size:1.2rem;margin:0;letter-spacing:.08em;text-transform:uppercase}
.ver{font-size:.75rem;color:var(--muted)}
.folder{font-size:.9rem;color:var(--muted);max-width:22rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:.4rem;
  border:0;background:none;padding:.2rem .3rem;cursor:pointer}
.folder:hover span{text-decoration:underline}
.folder svg{width:26px;height:22px;flex:none;shape-rendering:crispEdges}
.folder span{overflow:hidden;text-overflow:ellipsis}
/* aperçu toujours en 16:9 (format des photos de Petri-capture), le plus grand possible dans la place disponible */
.stage{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
.frame{position:relative;box-sizing:content-box;width:min(100cqw - 22px, (100cqh - 22px) * 16 / 9);aspect-ratio:16/9;padding:6px;background:var(--ink);box-shadow:8px 8px 0 rgba(26,26,26,.16)}
.screen{position:absolute;inset:6px;overflow:hidden;background:var(--viewer);cursor:crosshair;touch-action:none;user-select:none}
.screen.panning{cursor:grabbing}
.pan{position:absolute;left:0;top:0;transform-origin:0 0}
.pan img{display:block;width:100%;height:100%;image-rendering:auto;pointer-events:none}
.pan svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.empty{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:1rem;color:var(--paper);text-align:center;padding:2rem;cursor:default}
.empty p{margin:0;max-width:30rem}
.empty .row{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;padding:0 var(--b) var(--b) 0}
.empty .btn{color:var(--ink);box-shadow:var(--b) var(--b) 0 #666}
.empty .btn.primary{background:var(--dish);color:var(--ink)}
.zoomhint{position:absolute;left:.6rem;bottom:.5rem;max-width:44%;color:#ddd;font-size:.75rem;pointer-events:none;text-shadow:0 1px 2px #000}
.zoombar{position:absolute;right:.6rem;top:.6rem;display:flex;gap:.4rem;padding:0 var(--b) var(--b) 0}
/* mode 2 boîtes : choix 1/2 boîtes et réglage des cercles, en haut à gauche de l'image */
.platebar{position:absolute;left:.6rem;top:.6rem;display:flex;gap:.4rem;padding:0 var(--b) var(--b) 0;z-index:2}
.platebar .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.screen.adjusting{cursor:move}
.nav{display:flex;align-items:center;gap:.8rem;padding:0 var(--b) var(--b) 0}
.nav .file{flex:1;min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .file b{display:block;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis}
.nav .file span{display:block;font-size:1.35rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15} /* « 3 / 12 » bien lisible */
.nav .btn{min-width:9rem}

/* ---------- Panneau de droite : compteur, nom, tableau ---------- */
.side{display:flex;flex-direction:column;gap:.7rem;min-height:0;padding:.7rem 1rem .8rem .3rem;overflow:hidden}
.side > .card{flex:none}
/* le panneau ne défile pas : la liste défile dans son cadre ; si la place manque (mode 2 boîtes), la carte du nom défile aussi */
.side > .naming{flex:0 1 auto;min-height:9rem;overflow-y:auto}
.side > .table{flex:1 0 13rem}
.card{background:var(--paper);border:var(--b) solid var(--ink);box-shadow:var(--b) var(--b) 0 var(--ink);padding:.6rem .7rem}
.counter{display:flex;align-items:center;gap:.6rem}
.counter .num{flex:1;text-align:center;line-height:1}
.counter .num b{display:block;font-size:clamp(2.1rem,4.6vh,3rem);font-variant-numeric:tabular-nums;line-height:.9}
.counter .num span{display:block;margin-top:-.35em;font-size:clamp(1.5rem,3.2vh,2.1rem);font-weight:700;letter-spacing:.06em;color:#A39A88} /* « CFU » sous le compte, grand, gris clair */
.counter{padding:.35rem .6rem}
.counter .btn{width:40px;min-height:36px;padding:0;font-size:1.2rem}
.lbl{display:block;font-size:1.3rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:.6rem 0 .3rem}
.lbl:first-child{margin-top:0}
.inline{display:flex;gap:.45rem;align-items:center}
.inline input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 var(--b) var(--b) 0;margin-bottom:.4rem}
.chip{display:inline-flex;align-items:center;border:2px solid var(--ink);background:var(--bg);font-size:.85rem;box-shadow:2px 2px 0 var(--ink)}
.chip button{border:0;background:none;padding:.15rem .5rem;min-height:30px;display:inline-flex;align-items:center;gap:.4rem}
/* case cochée : groupe sélectionné pour l'image en cours */
.chip .tick{width:16px;height:16px;flex:none;border:2px solid currentColor;background:var(--paper)}
.chip[aria-pressed="true"] .tick{background:var(--paper) url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%207%206%27%20shape-rendering%3D%27crispEdges%27%20fill%3D%27%231A1A1A%27%3E%3Cpath%20d%3D%27M6%200h1v2H6zM5%201h1v2H5zM4%202h1v2H4zM0%202h1v2H0zM1%203h1v2H1zM3%203h1v2H3zM2%204h1v2H2z%27%2F%3E%3C%2Fsvg%3E") center/10px 9px no-repeat;border-color:var(--paper)}
.chip .x{padding:.15rem .4rem;border-left:2px solid var(--ink);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] .x{color:var(--paper);border-left-color:var(--paper)}
.final{margin-top:.55rem;padding:.35rem .5rem;border:2px dashed var(--ink);font-weight:700;word-break:break-all;min-height:calc(1.35em + .7rem + 4px);line-height:1.35} /* même hauteur vide ou rempli */
.final.fallback{color:var(--muted);font-weight:400}
/* carte du nom, compacte : titre à gauche de son champ ; titres (17,6 px) toujours plus grands que le contenu (15 px) */
.naming{padding:.5rem .6rem}
.naming .frow{display:grid;grid-template-columns:6.3rem minmax(0,1fr);gap:.45rem;align-items:start;margin-bottom:.4rem}
.naming .lbl{margin:0;padding-top:.3rem;font-size:1.1rem}
.naming .frow.stack{grid-template-columns:minmax(0,1fr);gap:.2rem} /* listes : titre au-dessus, toute la largeur pour les cases */
.naming .frow.stack .lbl{padding-top:0}
.naming input[type=text]{min-height:32px;font-size:.95rem;padding:0 .45rem}
.naming .chips{gap:.3rem;margin-bottom:0}
.naming .chips + .inline{margin-top:.35rem}
.naming .chip{font-size:.8rem}
.naming .chip button{min-height:26px;padding:.05rem .4rem;gap:.3rem}
.naming .chip .x{padding:.05rem .3rem}
.naming .chip .tick{width:13px;height:13px}
.naming .chips.scope{margin-top:.35rem}
.naming .chips.plates{margin-bottom:.45rem}
.naming .chips.plates .chip{font-size:.95rem}
.naming .final .pl{display:block}
.naming .final .pl.off{font-weight:400;color:var(--muted)}
.naming .unit{display:flex;align-items:center;gap:.3rem .3rem;flex-wrap:wrap}
.naming .unit input{flex:0 1 4.6rem;width:4.6rem;min-width:3rem}
.naming .unit .pre,.naming .unit .suf{color:var(--muted);font-size:.95rem;white-space:nowrap}
.naming .unit .btn{flex:none;margin-left:auto}
#dilNotes .choice{margin:.25rem 0}
.naming .chips.dils{margin-top:.35rem}
.naming .chips.dils:empty{display:none}
.naming .chips.dils button{padding:.05rem .45rem}
tr.ign td{color:#B5AC98;text-decoration:line-through}
tr.cur.ign td{color:#8C8370}
.naming .final{margin-top:.2rem;padding:.2rem .45rem;font-size:.95rem;min-height:calc(1.35em + .4rem + 4px)}
/* tableau toujours visible, il prend la place qui reste */
.table{flex:1 0 13rem;min-height:13rem;display:flex;flex-direction:column;padding:0}
.table .head{display:flex;justify-content:space-between;align-items:flex-end;gap:.5rem;padding:.45rem .6rem 0;border-bottom:var(--b) solid var(--ink)}
.table .head .saved{align-self:center;padding-bottom:.2rem}
.table .head b{text-transform:uppercase;letter-spacing:.06em;font-size:1.3rem}
/* onglets Résultats / Graphique */
/* onglets : rectangles bas aux coins en escalier pixel, même hauteur ; l'actif, clair, se fond dans le contenu, l'autre est sombre */
.tabs{display:flex;align-items:flex-end;gap:.3rem}
.tabs button{position:relative;isolation:isolate;border:0;background:none;padding:.1rem .85rem 0;line-height:1.15;min-height:0;
  font-size:1.3rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#3A332A}
.tabs button::before,.tabs button::after{content:'';position:absolute;z-index:-1}
.tabs button::before{inset:0;background:var(--ink);clip-path:polygon(0 5px,5px 5px,5px 0,calc(100% - 5px) 0,calc(100% - 5px) 5px,100% 5px,100% 100%,0 100%)}
.tabs button::after{inset:3px 3px 0;background:#B8AA8B;clip-path:polygon(0 5px,5px 5px,5px 0,calc(100% - 5px) 0,calc(100% - 5px) 5px,100% 5px,100% 100%,0 100%)} /* même marche que le contour : trait de 3 px partout, coins compris */
.tabs button[aria-selected="true"]{color:var(--ink);z-index:1}
.tabs button[aria-selected="true"]::before{bottom:calc(-1 * var(--b))} /* les bords descendent jusqu'au contenu… */
.tabs button[aria-selected="true"]::after{background:var(--paper);bottom:calc(-1 * var(--b) - 1px)} /* …et le fond recouvre toute la ligne, sans trait résiduel */
.tabs button:not([aria-selected="true"]):hover::after{background:#C9BC9E}
/* copier le graphique : icône seule, en haut à droite */
.copygraph{position:absolute;top:.4rem;right:.5rem;z-index:2;width:22px;height:24px;padding:0;border:0;background:none;display:grid;place-items:center;cursor:pointer;opacity:.75}
.copygraph:hover{opacity:1}
.copygraph:active{transform:translate(1px,1px)}
.copygraph svg{width:15px;height:17px;shape-rendering:crispEdges}
.graph{flex:1;position:relative;min-height:0}
.graph svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.graph .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:.25rem .5rem;font-size:.85rem;white-space:nowrap;box-shadow:2px 2px 0 var(--muted);z-index:2}
.gempty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:1rem;margin:0;color:var(--muted);font-size:.95rem}
.table .scroll{flex:1;min-height:0;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:1.02rem}
th,td{padding:.32rem .55rem;border-bottom:1px solid rgba(26,26,26,.25);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--paper);border-bottom:2px solid var(--ink);font-size:1.12rem;text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;width:4.5rem;border-left:1px solid rgba(26,26,26,.25)}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--bg)}
tr.cur td{background:var(--ink);color:var(--paper)}
tr .unnamed{color:var(--muted)}
tr.cur .unnamed{color:#cfc6b3}
.saved{font-size:.75rem;color:var(--muted);min-height:1em}
.saved.err{color:var(--err)}
/* curseurs, cases à cocher et boutons radio en style pixel (repris de l'app de capture) */
input[type=range]{--p:50%;-webkit-appearance:none;appearance:none;width:100%;height:36px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:14px;border:var(--b) solid var(--ink);background:linear-gradient(90deg,var(--ink) 0 var(--p),var(--paper) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:28px;margin-top:-10px;border:var(--b) solid var(--ink);border-radius:0;background:var(--paper);box-shadow:var(--b) var(--b) 0 var(--ink)}
input[type=range]:active::-webkit-slider-thumb{background:var(--wait)}
input[type=range]::-moz-range-track{height:8px;border:var(--b) solid var(--ink);background:var(--paper)}
input[type=range]::-moz-range-progress{height:8px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:14px;height:22px;border:var(--b) solid var(--ink);border-radius:0;background:var(--paper);box-shadow:var(--b) var(--b) 0 var(--ink)}
input[type=range]:active::-moz-range-thumb{background:var(--wait)}
.check{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;min-height:36px}
/* cases à cocher et boutons radio en style pixel */
input[type=checkbox],input[type=radio]{-webkit-appearance:none;appearance:none;flex:none;width:24px;height:24px;margin:0 var(--b) var(--b) 0;
  border:var(--b) solid var(--ink);border-radius:0;background:var(--paper);box-shadow:var(--b) var(--b) 0 var(--ink);cursor:pointer;display:grid;place-content:center}
input[type=checkbox]:checked{background:var(--paper) url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%207%206%27%20shape-rendering%3D%27crispEdges%27%20fill%3D%27%231A1A1A%27%3E%3Crect%20x%3D%276%27%20y%3D%270%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%275%27%20y%3D%271%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%276%27%20y%3D%271%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%270%27%20y%3D%272%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%274%27%20y%3D%272%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%275%27%20y%3D%272%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%270%27%20y%3D%273%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%271%27%20y%3D%273%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%273%27%20y%3D%273%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%274%27%20y%3D%273%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%271%27%20y%3D%274%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%272%27%20y%3D%274%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%273%27%20y%3D%274%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3Crect%20x%3D%272%27%20y%3D%275%27%20width%3D%271%27%20height%3D%271%27%2F%3E%3C%2Fsvg%3E") center/14px 12px no-repeat}
input[type=radio]::before{content:'';width:10px;height:10px;background:var(--ink);transform:scale(0)}
input[type=radio]:checked::before{transform:scale(1)}
input[type=checkbox]:active,input[type=radio]:active{transform:translate(var(--b),var(--b));box-shadow:none}

.check{display:flex;align-items:center;gap:.6rem;margin:.5rem 0;min-height:34px}
dialog.pix{border:5px solid var(--ink);background:var(--paper);color:var(--ink);padding:1rem 1.2rem;width:min(30rem,94vw);max-height:94vh;overflow:auto;box-shadow:8px 8px 0 var(--ink)}
dialog.pix::backdrop{background:rgba(26,26,26,.45)}
dialog.pix h2{margin:0 0 .6rem;font-size:1.55rem;text-transform:uppercase;letter-spacing:.06em}
dialog.pix .lbl{margin-top:.9rem}
dialog.pix .lbl span{font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:.4rem}
dialog.pix .row{display:flex;justify-content:flex-end;margin-top:1rem;padding:0 var(--b) var(--b) 0}
.choices{display:flex;flex-wrap:wrap;gap:.3rem 1.1rem}
.choice{display:flex;align-items:center;gap:.5rem;min-height:32px}
.swatches{display:flex;gap:.5rem;padding:0 var(--b) var(--b) 0}
.swatch{width:34px;height:34px;border:var(--b) solid var(--ink);box-shadow:var(--b) var(--b) 0 var(--ink);padding:0}
.swatch[aria-pressed="true"]{outline:var(--b) solid var(--ink);outline-offset:3px}
/* menu d'export du tableau */
.menuwrap{position:relative}
.menu{position:absolute;left:0;top:calc(100% + 8px);z-index:30;min-width:17rem;background:var(--paper);border:var(--b) solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:.25rem 0}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:.5rem .8rem;min-height:42px}
.menu button:hover:not([disabled]),.menu button:focus-visible{background:var(--bg);outline:none}
.menu button[disabled]{opacity:.4;cursor:default}
.menu .mhead{padding:.55rem .8rem .2rem;font-size:1.3rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);border-top:2px dashed var(--ink)}
.menu .mhead:first-child{border-top:0}
.chips.scope{margin-top:.5rem;margin-bottom:0}
.chip.plus button{padding:.15rem .6rem;font-weight:700}
.toast{position:absolute;right:.7rem;bottom:.5rem;max-width:55%;text-align:right;color:#E8E2D2;font-size:.8rem;text-shadow:0 1px 2px #000;
  pointer-events:none;opacity:0;transition:opacity .3s} /* message discret, en bas à droite de l'image */
.toast.show{opacity:.9}
@media (max-height:640px){ .side{gap:.5rem} .card{padding:.45rem .6rem} }
</style>
</head>
<body>

<div class="main">
  <div class="top">
    <div class="brand"><h1>Petri·Count</h1><span class="ver" id="ver"></span></div>
    <button class="folder" id="folderName" type="button" hidden></button>
    <button class="btn" id="btnFolder" type="button" data-i18n="chooseFolder"></button>
    <div class="menuwrap">
      <button class="btn" id="btnCsv" type="button" data-i18n="exportBtn" aria-haspopup="menu" aria-expanded="false" disabled></button>
      <div class="menu" id="csvMenu" role="menu" hidden>
        <div class="mhead" data-i18n="mCsv"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const VERSION = 'v26 · 12/11';
const SAVE_FILE = 'petri-comptage.json';

const canWriteFolder = typeof window.showDirectoryPicker === 'function'; // Chrome, Edge : lecture et écriture dans le dossier
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },

/* ---------- Langues ---------- */
const I18N = {
  en: {
    chooseFolder:'Choose the photo folder', folderTip:'Open the folder picker in this folder', exportCsv:'Export (.csv)', prev:'Previous', next:'Next', fit:'Fit',

    prefixAllD: p => 'All ' + p.n + ' images of the folder will get this prefix, including those not opened yet. The ↶ ↷ arrows on this image can undo it.', apply:'Apply',
    onePlate:'1 plate', twoPlates:'2 plates', adjust:'Adjust circles', adjustDone:'Done', plateN: p => 'Plate ' + p.n,
    adjustHint:'Drag a circle to move it, drag its edge to resize it. Click Done to count again.',
    group:'Group', groupPh:'New group…', dilution:'Dilution', volume:'Volume', setDil:'Set dilution', dilAll:'Apply to all plates', status:'Status',
    dilHow:'Choose how dilutions are written for this folder. Each plate then only needs the number.',
    noteColon:'1:X  (1:10, 1:100…)', notePow:'10^-X  (10^-1, 10^-2…)', notePct:'Percent  (10 %, 1 %…)', noteDec:'Decimal  (0.1, 0.01…)',
    stCounted:'Counted', stZero:'0 growth', stNC:'NC', stIgnored:'Ignore',
    dilAllQ: p => 'Apply dilution ' + (p.d || '(none)') + ' and volume ' + (p.v || '–') + ' µL to all plates?',
    dilAllD: p => 'All ' + p.n + ' images of the folder (every plate) will get these values, replacing those already set; images not opened yet get them too. The ↶ ↷ arrows on this image can undo it.',
    unitC:'CFU/sample', add:'Add', name:'Name', namePh:'e.g. 10-3', results:'Results', colName:'Name', graph:'Graph', noGroup:'No group', copyGraph:'Copy the graph', graphCopied:'Graph copied to the clipboard.', copyFail:'Could not copy the graph.',

    graphTip: p => p.g + ': mean ' + p.m + ' CFU/sample (SD ' + p.sd + ', ' + p.n + ' sample' + (p.n > 1 ? 's' : '') + ')',
    noImages:'No images found in this folder.', savedFolder:'Saved in the folder', savedLocal:'Saved in the browser',
    saveErr:'Save failed', csvDone: p => 'Table saved: ' + p.f,

    csvHere:'In the image folder', csvElse:'Choose another location…', settings:'Settings', close:'Close',
    exportBtn:'Export', mCsv:'Table (.csv)', mXlsx:'Excel (.xlsx)', xlsxNoLib:'The Excel module could not load (offline?).', mPdf:'Report (.pdf)', newGroup:'New group',
    expName:'Experiment name', expDesc:'Short description', required:'required', optional:'optional', cancel:'Cancel', create:'Create report',
    pdfEnglish:'The report is written in English so it can be shared as is.', incGraph:'Add a final page comparing all groups (CFU/sample)',
    folderData:'Counts for this folder', wipe:'Erase all counts for this folder',
    wipeTitle:'Erase everything?', wipeText: p => 'Counts, names and groups for the folder “' + p.f + '” will be deleted (' + p.s + ' file and browser copy). This cannot be undone: they cannot be recovered. The photos are not touched.',
    typeWord: p => 'Type “' + p.w + '” to confirm',
    wipeYes:'Erase', wiped:'Counts erased.', noFolder:'Choose a folder first.',
    restoreTitle:'Copy found in the browser', restoreText: p => 'The folder has no save file (' + p.s + '), but the browser kept a copy (' + p.n + ' image(s) counted). Restore it?',
    restoreYes:'Restore the copy', restoreNo:'Start from scratch',
    pdfBusy: p => 'Building the report… ' + p.i + ' / ' + p.n, pdfDone: p => 'Report saved: ' + p.f, pdfNoLib:'The PDF module could not load (offline?).',
    markSize:'Marker size', markColor:'Marker colour', markNum:'Number the markers', keepZoom:'Keep the zoom when changing image',
    nameSep:'Final name separator', csvSep:'CSV separator', space:'space', csvSemi:'; (Excel in French)', csvComma:', (Excel in English)'
  }
};
const lang = 'en'; // le site est en anglais uniquement
const t = (k, p) => { const v = I18N[lang][k] !== undefined ? I18N[lang][k] : I18N.en[k]; return typeof v === 'function' ? v(p || {}) : v; };
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', t(e.dataset.i18nAria)); e.title = t(e.dataset.i18nAria); });
  document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh); });
  $('browserNote').textContent = canWriteFolder ? '' : t('noWrite');
  updateReopen(); renderSaved(); renderTable();
  if ($('setDlg').open) buildSettings();
}
$('ver').textContent = VERSION;

/* ---------- Réglages (gardés dans le navigateur) ---------- */
const COLORS = ['#F2C14E', '#FF4F4F', '#3FD0E0', '#5BD65B', '#FF5FD2', '#FFFFFF'];
const S = Object.assign({ size:9, color:COLORS[0], num:false, keepZoom:false, sep:'_', csvSep:';' }, store.get('petri.count.settings', {}));
const saveS = () => { store.set('petri.count.settings', S); renderAll(); };
function buildSettings(){
  const r = $('sSize'); r.value = S.size; $('vSize').textContent = S.size + ' px';
  r.style.setProperty('--p', ((S.size - r.min) / (r.max - r.min) * 100) + '%');
  $('swatches').innerHTML = '';
  COLORS.forEach(c => { const b = document.createElement('button'); b.type = 'button'; b.className = 'swatch'; b.style.background = c; b.setAttribute('aria-label', c);
    b.setAttribute('aria-pressed', String(S.color === c)); b.addEventListener('click', () => { S.color = c; saveS(); buildSettings(); }); $('swatches').appendChild(b); });
  $('cNum').checked = S.num; $('cKeepZoom').checked = S.keepZoom;
  const radios = (box, name, opts, key) => { $(box).innerHTML = '';
    opts.forEach(([v, label]) => { const l = document.createElement('label'); l.className = 'choice';
      const i = document.createElement('input'); i.type = 'radio'; i.name = name; i.checked = S[key] === v;
      i.addEventListener('change', () => { S[key] = v; saveS(); });
      l.append(i, document.createTextNode(label)); $(box).appendChild(l); }); };
  radios('sepChoices', 'sep', [['_', '_'], ['-', '-'], [' ', t('space')], ['.', '.']], 'sep');
  radios('csvSepChoices', 'csvsep', [[';', t('csvSemi')], [',', t('csvComma')]], 'csvSep');
}
$('sSize').addEventListener('input', e => { S.size = +e.target.value; buildSettings(); saveS(); });
$('cNum').addEventListener('change', e => { S.num = e.target.checked; saveS(); });
$('cKeepZoom').addEventListener('change', e => { S.keepZoom = e.target.checked; saveS(); });
$('btnSettings').addEventListener('click', () => { buildSettings(); $('setDlg').showModal(); });
$('setClose').addEventListener('click', () => $('setDlg').close());
$('btnWipe').addEventListener('click', async () => {
  if (!folder){ toast(t('noFolder')); return; }
  if (!(await ask(t('wipeTitle'), t('wipeText', { f:folder, s:SAVE_FILE }), t('wipeYes'), t('cancel'), 'erase'))) return;
  clearTimeout(saveTimer); await saving;
  try{ localStorage.removeItem(localKey()); }catch(e){}
  if (dir){ try{ await dir.removeEntry(SAVE_FILE); }catch(e){} }
  const keepIdx = Math.max(0, idx);
  data = blank(); resetCarry(); plate = 0; adjusting = false; for (const k in hist) delete hist[k];
  idx = -1; $('setDlg').close(); toast(t('wiped'));
  if (files.length) await show(keepIdx);
});

// question avec deux réponses, dans le style du site ; résout à vrai pour « oui ».
// word : mot à taper pour pouvoir confirmer (actions définitives)
function ask(title, text, yes, no, word){
  return new Promise(res => {
    const d = $('askDlg'); $('askTitle').textContent = title; $('askText').textContent = text; $('askYes').textContent = yes; $('askNo').textContent = no;
    const box = $('askTypeBox'), inp = $('askType'), yesB = $('askYes');
    box.hidden = !word; inp.value = ''; yesB.disabled = !!word;
    yesB.className = 'btn ' + (word ? 'danger' : 'primary'); // action définitive : bouton rouge
    if (word){ $('askTypeLbl').textContent = t('typeWord', { w:word }); inp.oninput = () => { yesB.disabled = inp.value.trim().toLowerCase() !== word; };
      inp.onkeydown = e => { if (e.key === 'Enter' && !yesB.disabled){ e.preventDefault(); yesB.click(); } }; }
    const done = v => { $('askYes').onclick = $('askNo').onclick = d.oncancel = inp.oninput = inp.onkeydown = null; d.close(); res(v); };
    $('askYes').onclick = () => done(true); $('askNo').onclick = () => done(false); d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal(); if (word) inp.focus();
  });
}

// dossier en pixel art (13 × 11) : contour noir, intérieur jaune comme les repères
const FOLDER_SVG = (() => {
  const rows = ['.####........', '#mmmm#.......', '#mmmmm######.', '#############', '#yyyyyyyyyyy#', '#yyyyyyyyyyy#', '#yyyyyyyyyyy#', '#yyyyyyyyyyy#', '#yyyyyyyyyyy#', '#############'];
  const col = { '#':'#1A1A1A', m:'#D9A93A', y:'#F2C14E' };
  return '<svg viewBox="0 0 13 10" aria-hidden="true">' + rows.map((r, y) => [...r].map((ch, x) => col[ch] ? '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + col[ch] + '"/>' : '').join('')).join('') + '</svg>';
})();

let toastT = null;
function toast(msg){ const e = $('toast'); e.textContent = msg; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 3200); }

/* ---------- Données ----------
   Une sauvegarde par dossier (petri-comptage.json dans le dossier, et une copie dans le navigateur) :
   { version, prefix, group, groups:[…], images:{ fichier:{ prefix, group, name, marks:[[x, y], …] } } }
   x et y sont en fractions de la largeur et de la hauteur de l'image. */
let dir = null, folder = '', files = [], idx = -1;
let data = blank();
// valeurs reportées sur chaque nouvelle image tant qu'on ne les change pas : C[0] pour la boîte (ou la boîte 1), C[1] pour la boîte 2
const C = [{ prefix:'', group:'', dilution:'', vol:'100' }, { prefix:'', group:'', dilution:'', vol:'100' }];
const resetCarry = () => { C[0] = { prefix:'', group:'', dilution:'', vol:'100' }; C[1] = { prefix:'', group:'', dilution:'', vol:'100' }; };
/* ---------- Mode 2 boîtes ----------
   Deux cercles (communs à tout le dossier, x/y en fractions de l'image, r en fraction de la largeur) délimitent les boîtes.
   Boîte 1 = les champs de l'image (prefix, group, dilution, name) ; boîte 2 = image.p2. Chaque repère appartient à la boîte
   dont le cercle le contient (sinon la plus proche) : déplacer un cercle réattribue les repères. */
const dbl = () => !!data.double;
let plate = 0, adjusting = false;
const circles = () => data.circles || (data.circles = [{ x:.27, y:.5, r:.21 }, { x:.73, y:.5, r:.21 }]);
function p2Of(r){ if (!r.p2) r.p2 = { prefix:r.prefix || '', group:'', dilution:'', vol:r.vol || '100', name:'' }; return r.p2; }
const fieldsOf = (r, i) => i ? p2Of(r) : r;
const cur = () => dbl() ? plate : 0;
const tgt = () => { const r = rec(); return r && fieldsOf(r, cur()); };
function plateOf(m, ar){ const d = circles().map(c => Math.hypot(m[0] - c.x, (m[1] - c.y) * ar) / c.r); return d[0] <= 1 ? 0 : d[1] <= 1 ? 1 : (d[0] <= d[1] ? 0 : 1); }
const countOf = (r, i) => !dbl() || i == null ? r.marks.length : r.marks.filter(m => plateOf(m, r.ar || 9/16) === i).length;
// une entrée par boîte comptée : { f, r, plate, fields, count } (une par image hors mode 2 boîtes)
function samples(){
  const out = [];
  files.forEach(f => { const r = data.images[f.name]; if (!r || r.pending) return;
    if (dbl()) [0, 1].forEach(i => out.push({ f, r, plate:i, fields:fieldsOf(r, i), count:countOf(r, i) }));
    else out.push({ f, r, plate:null, fields:r, count:r.marks.length }); });
  return out;
}
const sampleName = sm => finalName(sm.fields) || stem(sm.f.name) + (sm.plate != null ? ' (' + (sm.plate + 1) + ')' : '');
// Une boîte : n colonies (0 si « 0 growth »), F facteur de dilution, V volume en mL ; C = N × F / V si la boîte compte
const volML = fl => { const v = parseFloat(String(fl.vol == null ? '' : fl.vol).replace(',', '.')); return v > 0 ? v / 1000 : 0; };
function plateRows(){
  return samples().filter(sm => (sm.fields.status || '') !== 'ignored').map(sm => {
    const st = sm.fields.status || '', n = st === 'zero' ? 0 : sm.count, F = parseFactor(sm.fields.dilution), V = volML(sm.fields);
    const ok = !st && n > 0 && F > 0 && V > 0; // 0, NC, sans dilution ou sans volume : hors calcul
    return Object.assign({}, sm, { status:st, n, F, V, C: ok ? n * F / V : null, ok });
  });
}
// sample = même préfixe, même groupe, même nom (la dilution et le volume peuvent varier) ; sans nom : la boîte seule
const sampleKey = pr => { const fl = pr.fields, nm = (fl.name || '').trim(); return [fl.prefix, fl.group].map(v => (v || '').trim()).concat(nm || ('#' + pr.f.name + (pr.plate || 0))).join('\u0001'); };
const sampleLabel = pr => [pr.fields.prefix, pr.fields.group, pr.fields.name].map(v => (v || '').trim()).filter(Boolean).join(S.sep) || stem(pr.f.name);
const meanSd = v => { const m = v.reduce((a, b) => a + b, 0) / v.length; return { m, sd: v.length > 1 ? Math.sqrt(v.reduce((a, b) => a + (b - m)**2, 0) / (v.length - 1)) : 0 }; };
function sampleStats(){

  if (dbl()){ const pi = plateOf([x / natW, y / natH], natH / natW); if (pi !== plate){ plate = pi; syncInputs(); } } // compter dans un cercle sélectionne sa boîte

function parseFactor(str){ // facteur de dilution F (dilué F fois) ; 0 si illisible
  const v = String(str || '').trim().replace(',', '.').replace(/\s+/g, ''); let m;
  if (!v) return 0;
  if ((m = v.match(/^1[:/](\d*\.?\d+)$/))) return +m[1];
  if ((m = v.match(/^10\^?-(\d*\.?\d+)$/))) return 10 ** +m[1];
  if ((m = v.match(/^(\d*\.?\d+)e-(\d+)$/i))) return 1 / (+m[1] * 10 ** -+m[2]);
  if ((m = v.match(/^(\d*\.?\d+)%$/))) return +m[1] > 0 ? 100 / +m[1] : 0;
  if ((m = v.match(/^-(\d*\.?\d+)$/))) return 10 ** +m[1];
  if ((m = v.match(/^(\d*\.?\d+)$/))) { const d = +m[1]; return d <= 0 ? 0 : d < 1 ? 1 / d : d; }
  return 0;
}

function groupStats(){
  const by = new Map(); // moyenne par groupe des CFU/sample de ses samples
  sampleStats().forEach(sp => { if (!by.has(sp.g)) by.set(sp.g, []); by.get(sp.g).push(sp.m); });
  const order = [...data.groups.filter(g => by.has(g)), ...[...by.keys()].filter(g => g && !data.groups.includes(g)), ...(by.has('') ? [''] : [])];
  return order.map(g => { const v = by.get(g), m = v.reduce((a, b) => a + b, 0) / v.length;
    const sd = v.length > 1 ? Math.sqrt(v.reduce((a, b) => a + (b - m)**2, 0) / (v.length - 1)) : 0;
    return { g, label: g || t('noGroup'), m, sd, n: v.length }; });
}
const esc = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;');
// o : { svg, W, H } pour dessiner hors écran à une taille donnée (copie) ; sans o, dans l'onglet, avec survol
function renderGraph(o){
  const pane = $('paneGraph'), live = !o, svg = live ? $('chart') : o.svg, stats = groupStats(), named = stats.filter(s => s.g);
  if (live) $('chartTip').hidden = true;
  if (!named.length){ svg.innerHTML = ''; if (live){ $('chartEmpty').hidden = false; $('chartEmpty').textContent = t('graphEmpty'); } return false; }
  if (live) $('chartEmpty').hidden = true;
  const W = live ? pane.clientWidth : o.W, H = live ? pane.clientHeight : o.H; if (W < 50 || H < 50) return false;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  // noms des groupes : à l'horizontale s'ils tiennent, sinon en diagonale (jusqu'à 14 caractères)
  const slot0 = (W - 44) / stats.length, longest = Math.max(...stats.map(s => s.label.length));
  const tilt = longest * 6.4 > slot0 - 4, cut = v => v.length > 14 ? v.slice(0, 13) + '…' : v;
  // en direct, on laisse la place à l'icône de copie en haut à droite
  const L = 34, R = 10, T = live ? 32 : 24, B = tilt ? 16 + Math.min(14, longest) * 6.4 * .6 : 34, pw = W - L - R, ph = H - T - B;
  // graduation « ronde » (1, 2, 2,5, 3 ou 5 × 10^k) pour ~4 traits, haut d'axe au premier trait au-dessus du maximum
  const top0 = Math.max(...stats.map(s => s.m)) * 1.08 || 1, raw = top0 / 4, p10 = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 3, 5, 10].map(k => k * p10).find(v => v >= raw), nt = Math.ceil(top0 / step), max = step * nt;
  const y = v => T + ph - v / max * ph;
  const slot = pw / stats.length, bw = Math.max(8, Math.min(56, slot * .62));
  const font = 'font-family="ByteBounce, Pixelify Sans, monospace"';
  let out = '';
  // grille discrète : 4 graduations, pointillés
  for (let i = 0; i <= nt; i++){ const v = step * i, yy = y(v);
    if (i) out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="#1A1A1A" stroke-opacity=".18" stroke-dasharray="3 4"/>';
    out += '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="#5E5546" ' + font + '>' + fmtC(v) + '</text>'; }
  stats.forEach((s, i) => {
    const cx = L + slot*(i + .5), x = cx - bw/2, top = y(s.m), h = T + ph - top;
    // barre pixel : ombre décalée, remplissage jaune, contour noir
    if (h > 0) out += '<rect x="' + (x + 3) + '" y="' + (top + 3) + '" width="' + bw + '" height="' + Math.max(0, h - 3) + '" fill="#1A1A1A" opacity=".25"/>' +
      '<rect x="' + x + '" y="' + top + '" width="' + bw + '" height="' + h + '" fill="' + (s.g ? '#F2C14E' : '#D8CDB4') + '" stroke="#1A1A1A" stroke-width="2.5"/>';
    out += '<text x="' + cx + '" y="' + (top - 6) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" ' + font + '>' + fmtC(s.m) + '</text>';
    if (tilt) out += '<text x="' + (cx + 4) + '" y="' + (T + ph + 13) + '" text-anchor="end" transform="rotate(-35 ' + (cx + 4) + ' ' + (T + ph + 13) + ')" font-size="11" fill="#1A1A1A" ' + font + '>' + esc(cut(s.label)) + '</text>';
    else out += '<text x="' + cx + '" y="' + (T + ph + 15) + '" text-anchor="middle" font-size="11" fill="#1A1A1A" ' + font + '>' + esc(s.label) + '</text>' +
      '<text x="' + cx + '" y="' + (T + ph + 28) + '" text-anchor="middle" font-size="10" fill="#5E5546" ' + font + '>n=' + s.n + '</text>'; // en diagonale, n est dans la bulle
    // zone de survol plus large que la barre
    out += '<rect class="hit" data-i="' + i + '" x="' + (cx - slot/2) + '" y="' + T + '" width="' + slot + '" height="' + (ph + B) + '" fill="transparent"/>';
  });
  out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '" stroke="#1A1A1A" stroke-width="3"/>';
  out += '<text x="' + L + '" y="12" font-size="11" fill="#5E5546" ' + font + '>CFU/sample</text>';
  svg.innerHTML = out;
  if (!live) return true;
  svg.querySelectorAll('.hit').forEach(h => {
    h.addEventListener('pointerenter', () => { const s = stats[+h.dataset.i], tip = $('chartTip');
      tip.textContent = t('graphTip', { g:s.label, m:fmtC(s.m), sd:fmtC(s.sd), n:s.n }); tip.hidden = false;
      const cx = L + slot*(+h.dataset.i + .5); tip.style.left = Math.max(4, Math.min(W - tip.offsetWidth - 4, cx - tip.offsetWidth/2)) + 'px'; tip.style.top = Math.max(2, y(s.m) - 46) + 'px'; });
    h.addEventListener('pointerleave', () => { $('chartTip').hidden = true; });
  });
}

function csvText(){
  const sep = S.csvSep, q = v => (v.includes(sep) || /["\n]/.test(v)) ? '"' + v.replace(/"/g, '""') + '"' : v;
  // une ligne par boîte (boîtes ignorées exclues) ; CFU/sample = N × F / V (V en mL)
  const num = v => S.csvSep === ';' ? String(v).replace('.', ',') : String(v);
  const lines = [[t('colName'), 'Sample', 'Group', 'CFU', 'Status', 'Dilution', 'Dilution factor', 'Volume (µL)', 'CFU/sample', 'Image'].concat(dbl() ? ['Plate'] : []).join(sep)];
  plateRows().forEach(pr => lines.push([q(sampleName(pr)), q(sampleLabel(pr)), q(pr.fields.group || ''), pr.status === 'nc' ? 'NC' : pr.n,
    ({ '':'counted', zero:'0 growth', nc:'NC' })[pr.status], q(pr.fields.dilution || ''), pr.F ? num(pr.F) : '', q(String(pr.fields.vol || '')),
    pr.C == null ? '' : num(pr.C), q(pr.f.name)].concat(dbl() ? [pr.plate + 1] : []).join(sep)));
  return '\ufeff' + lines.join('\r\n') + '\r\n'; // BOM : les accents s'affichent correctement dans Excel
}

// La fenêtre doit s'ouvrir juste après le clic : on choisit donc l'emplacement avant de préparer le contenu.
async function pickTarget(fname, mime, ext, here){
  if (here) return { fh: await dir.getFileHandle(fname, { create:true }), name:fname };
  if (typeof window.showSaveFilePicker === 'function'){
    try{
      const fh = await window.showSaveFilePicker({ suggestedName:fname, startIn: dir || 'documents', types:[{ description:ext.toUpperCase(), accept:{ [mime]:['.' + ext] } }] });
      return { fh, name:fh.name };
    }catch(e){ if (e && e.name === 'AbortError') return null; }
  }
  return { name:fname, mime };
}
async function writeTarget(tg, content){
  if (tg.fh){ await writeTo(tg.fh, content); return tg.name; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(content instanceof Blob ? content : new Blob([content], { type:tg.mime })); a.download = tg.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 20000);
  return tg.name;
}

/* Classeur Excel : onglet « Plates » (comme le CSV, une ligne par boîte), onglet « Samples » (moyenne des CFU/sample
   des boîtes d'un même sample, toutes dilutions confondues) et onglet « Groups ». Module SheetJS chargé au premier export. */
let xlsxLib = null;
function loadXlsx(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return xlsxLib || (xlsxLib = new Promise((res, rej) => { const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('xlsx')); sc.onerror = () => { xlsxLib = null; rej(new Error('xlsx')); };
    document.head.appendChild(sc); }));
}
const r1 = v => v == null || !isFinite(v) ? '' : Math.round(v * 10) / 10;
function workbook(X){
  const rows = plateRows(), stat = { '':'counted', zero:'0 growth', nc:'NC' };
  const plates = [[t('colName'), 'Sample', 'Group', 'CFU', 'Status', 'Dilution', 'Dilution factor', 'Volume (µL)', 'CFU/sample', 'Image'].concat(dbl() ? ['Plate'] : [])];
  rows.forEach(pr => { const v = parseFloat(String(pr.fields.vol || '').replace(',', '.'));
    plates.push([sampleName(pr), sampleLabel(pr), pr.fields.group || '', pr.status === 'nc' ? 'NC' : pr.n, stat[pr.status], pr.fields.dilution || '',
      pr.F || '', isFinite(v) ? v : (pr.fields.vol || ''), r1(pr.C), pr.f.name].concat(dbl() ? [pr.plate + 1] : [])); });
  // samples : toutes les boîtes du sample, celles qui comptent pour la moyenne et celles exclues (0, NC, sans dilution ou volume)
  const by = new Map();
  rows.forEach(pr => { const k = sampleKey(pr); if (!by.has(k)) by.set(k, { label:sampleLabel(pr), g:pr.fields.group || '', all:[] }); by.get(k).all.push(pr); });
  const gOrder = [...data.groups, ...[...by.values()].map(sp => sp.g).filter(g => g && !data.groups.includes(g)), ''];
  const list = [...by.values()].sort((a, b) => gOrder.indexOf(a.g) - gOrder.indexOf(b.g) || a.label.localeCompare(b.label, undefined, { numeric:true }));
  const samples = [['Sample', 'Group', 'Plates used', 'Plates excluded', 'Dilutions', 'Volumes (µL)', 'Mean CFU/sample', 'SD', 'CFU/sample of each plate']];
  list.forEach(sp => { const ok = sp.all.filter(p => p.ok), ms = ok.length ? meanSd(ok.map(p => p.C)) : null;
    samples.push([sp.label, sp.g || t('noGroup'), ok.length, sp.all.length - ok.length, [...new Set(ok.map(p => p.fields.dilution))].join(', '),
      [...new Set(ok.map(p => p.fields.vol))].join(', '), ms ? r1(ms.m) : '', ms && ok.length > 1 ? r1(ms.sd) : '', ok.map(p => fmtC(p.C)).join('; ')]); });
  samples.push([], ['Mean = average of C = (N × F) / V over the plates of the sample (N colonies, F dilution factor, V volume in mL). Plates with 0 growth, NC, or without dilution or volume are excluded.']);
  const groups = [['Group', 'Samples', 'Mean CFU/sample', 'SD', 'Median', 'Min', 'Max']];
  groupTable().forEach(gs => groups.push([gs.label, gs.n, r1(gs.m), gs.n > 1 ? r1(gs.sd) : '', r1(gs.median), r1(gs.min), r1(gs.max)]));
  const wb = X.utils.book_new(), sheet = (aoa, widths) => { const ws = X.utils.aoa_to_sheet(aoa); ws['!cols'] = widths.map(w => ({ wch:w })); return ws; };
  X.utils.book_append_sheet(wb, sheet(plates, [28, 24, 14, 7, 10, 10, 10, 11, 12, 26, 6]), 'Plates');
  X.utils.book_append_sheet(wb, sheet(samples, [24, 14, 11, 14, 18, 13, 16, 10, 30]), 'Samples');
  X.utils.book_append_sheet(wb, sheet(groups, [18, 9, 16, 10, 10, 10, 10]), 'Groups');
  return new Blob([X.write(wb, { bookType:'xlsx', type:'array' })], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
async function exportXlsx(here){
  openMenu(false);
  const lib = loadXlsx().catch(() => null); // chargé pendant le choix de l'emplacement
  await saveNow();
  try{
    const tg = await pickTarget(csvName().replace(/\.csv$/, '.xlsx'), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', 'xlsx', here); if (!tg) return;
    const X = await lib; if (!X){ toast(t('xlsxNoLib')); return; }
    toast(t('csvDone', { f: await writeTarget(tg, workbook(X)) }));
  }catch(e){ console.error(e); toast(t('saveErr')); }
}
$('xlsxHere').addEventListener('click', () => exportXlsx(true));
$('xlsxElse').addEventListener('click', () => exportXlsx(false));

/* Rapport PDF, volontairement sobre (Helvetica, noir et blanc) pour être transmis tel quel :
   deux images par page A4, chacune entière avec ses repères (sans numéros), suivie d'un tableau Nom / CFU. */
async function reportImage(f, r){ // mode 2 boîtes : les cercles et le nom de chaque boîte sont dessinés sur l'image
  const file = f.file || await f.handle.getFile(), u = URL.createObjectURL(file);
  try{
    const img = new Image(); await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = u; });
    const k = Math.min(1, 2000 / img.naturalWidth), w = Math.round(img.naturalWidth*k), h = Math.round(img.naturalHeight*k);
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
    x.drawImage(img, 0, 0, w, h);
    const rad = Math.max(5, w * .008), lw = Math.max(1.5, w * .0022);
    r.marks.forEach(([mx, my]) => {
      x.beginPath(); x.arc(mx*w, my*h, rad, 0, 2*Math.PI); x.lineWidth = lw*2.4; x.strokeStyle = '#000'; x.stroke();
      x.beginPath(); x.arc(mx*w, my*h, rad, 0, 2*Math.PI); x.lineWidth = lw; x.strokeStyle = S.color; x.stroke();
    });
    if (dbl()) circles().forEach((c, i) => { if ((fieldsOf(r, i).status || '') === 'ignored') return;
      const cx = c.x*w, cy = c.y*h, rr = c.r*w, fs = Math.round(w*.03), fs2 = Math.round(w*.016), lx = cx - rr*.72, ly = cy - rr*.72;
      x.setLineDash([w*.012, w*.008]); x.lineWidth = w*.004; x.strokeStyle = '#fff'; x.beginPath(); x.arc(cx, cy, rr, 0, 2*Math.PI); x.stroke(); x.setLineDash([]);
      x.textAlign = 'center'; x.lineJoin = 'round'; x.font = 'bold ' + fs + 'px Helvetica, Arial, sans-serif';
      x.lineWidth = fs*.18; x.strokeStyle = '#000'; x.strokeText(String(i + 1), lx, ly); x.fillStyle = '#fff'; x.fillText(String(i + 1), lx, ly);
      const nm = finalName(fieldsOf(r, i)); if (nm){ x.font = fs2 + 'px Helvetica, Arial, sans-serif'; x.lineWidth = fs2*.25; x.strokeText(nm, lx, ly + fs2*1.5); x.fillText(nm, lx, ly + fs2*1.5); }
    });
    return { url:c.toDataURL('image/jpeg', .88), w, h };
  } finally { URL.revokeObjectURL(u); }
}
// le rapport est toujours rédigé en anglais, quelle que soit la langue de la page
// statistiques par groupe pour le rapport (mêmes images que l'onglet Graph)
function groupTable(){
  return groupStats().map(s => {
    const v = sampleStats().filter(sp => sp.g === s.g).map(sp => sp.m).sort((a, b) => a - b);
    const mid = v.length / 2, median = v.length % 2 ? v[Math.floor(mid)] : (v[mid - 1] + v[mid]) / 2;
    return Object.assign({}, s, { median, min:v[0], max:v[v.length - 1] });
  });
}
// Pages de synthèse, sobres : barres = moyenne (CFU/sample), barres d'erreur = écart-type, puis un tableau.
// C = N × F / V pour chaque boîte (N colonies, F facteur de dilution, V volume en mL) ; boîtes à 0, NC ou ignorées exclues.
function barPage(doc, header, { PW, PH, M, CW }, title, rows, caption, cols, rowVals, foot){
  doc.addPage(); header();
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(0); doc.text(title, M, 30);
  if (!rows.length){ doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(90); doc.text('No plate has a count, a dilution and a volume yet.', M, 40); return; }
  const gx = M + 18, gy = 38, gw = CW - 20, gh = 90, top0 = Math.max(...rows.map(r => r.m + r.sd)) * 1.08 || 1;
  const raw = top0 / 5, p10 = 10 ** Math.floor(Math.log10(raw)), step = [1, 2, 2.5, 5, 10].map(k => k * p10).find(v => v >= raw), nt = Math.ceil(top0 / step), max = step * nt;
  const y = v => gy + gh - v / max * gh;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(60); doc.setLineWidth(.15);
  for (let i = 0; i <= nt; i++){ const v = step * i, yy = y(v);
    doc.setDrawColor(i ? 225 : 0); if (i) doc.line(gx, yy, gx + gw, yy);
    doc.text(fmtC(v), gx - 2, yy + 1, { align:'right' }); }
  doc.setDrawColor(0); doc.setLineWidth(.3); doc.line(gx, gy, gx, gy + gh); doc.line(gx, gy + gh, gx + gw, gy + gh);
  doc.text('CFU/sample', gx - 14, gy - 4);
  const slot = gw / rows.length, bw = Math.min(22, slot * .55), tilt = rows.some(r => doc.getTextWidth(r.label) > slot - 2);
  rows.forEach((r, i) => {
    const cx = gx + slot * (i + .5), bt = y(r.m);
    doc.setFillColor(r.g ? 170 : 215); doc.setDrawColor(0); doc.setLineWidth(.25);
    if (r.m > 0) doc.rect(cx - bw/2, bt, bw, gy + gh - bt, 'FD');
    if (r.n > 1 && r.sd > 0){ const e1 = y(r.m + r.sd), e0 = y(Math.max(0, r.m - r.sd)); doc.setLineWidth(.3);
      doc.line(cx, e0, cx, e1); doc.line(cx - bw/5, e1, cx + bw/5, e1); doc.line(cx - bw/5, e0, cx + bw/5, e0); }
    doc.setTextColor(0); doc.setFontSize(rows.length > 12 ? 6.5 : 8);
    const lab = r.label.length > 28 ? r.label.slice(0, 27) + '…' : r.label;
    if (tilt) doc.text(lab, cx + 1.5, gy + gh + 4, { angle:35, align:'right' }); else doc.text(lab, cx, gy + gh + 5, { align:'center' });
  });
  let ty = gy + gh + (tilt ? 38 : 12);
  doc.setFontSize(8); doc.setTextColor(90); doc.splitTextToSize(caption, CW).forEach(l => { doc.text(l, M, ty); ty += 4; }); ty += 3;
  const rh = 7, total = cols.reduce((a, c) => a + c[1], 0), sc = CW / total, cw = cols.map(c => c[1] * sc);
  const row = (vals, head) => {
    let x = M; if (head){ doc.setFillColor(235, 235, 235); doc.rect(M, ty, CW, rh, 'F'); }
    doc.setFont('helvetica', head ? 'bold' : 'normal'); doc.setFontSize(8.5); doc.setTextColor(0);
    vals.forEach((v, i) => { const w = cw[i];
      if (cols[i][2] === 'l') doc.text(doc.splitTextToSize(String(v), w - 3)[0], x + 1.5, ty + 4.8); else doc.text(doc.splitTextToSize(String(v), w - 3)[0], x + w - 1.5, ty + 4.8, { align:'right' });
      x += w; });
    doc.setDrawColor(0); doc.setLineWidth(.25); doc.rect(M, ty, CW, rh);
    let lx = M; cw.slice(0, -1).forEach(w => { lx += w; doc.line(lx, ty, lx, ty + rh); });
    ty += rh;
  };
  row(cols.map(c => c[0]), true);
  rows.forEach(r => { if (ty > PH - 20){ doc.addPage(); header(); ty = 28; row(cols.map(c => c[0]), true); } row(rowVals(r)); });
  if (foot) row(foot, true); // ligne de synthèse en gras
}
const FORMULA = 'C = (N × F) / V for each plate: N = colonies counted, F = dilution factor, V = volume plated (mL). Plates marked 0 growth or NC, or without dilution or volume, are excluded.';
// synthèse d'un groupe, après ses images : une barre par sample, le tableau, et la moyenne du groupe en dernière ligne
function groupSummary(doc, header, geo, g){
  const sp = sampleStats().filter(s => s.g === g).map(s => Object.assign(s, { n:s.plates.length })), gs = groupTable().find(s => s.g === g);
  barPage(doc, header, geo, (g || 'No group') + ': summary', sp,
    'Bars: mean CFU/sample over the plates (dilutions) of each sample. Error bars: standard deviation between plates (n > 1). Last row: mean and standard deviation of the sample means of the group. ' + FORMULA,
    [['Sample', 56, 'l'], ['Plates', 13], ['Dilutions', 36, 'l'], ['Volumes (µL)', 24, 'l'], ['Mean', 24], ['SD', 22]],
    r => [r.label, r.n, r.dils.join(', '), r.vols.join(', '), fmtC(r.m), r.n > 1 ? fmtC(r.sd) : '–'],
    gs ? ['Group (' + gs.n + ' sample' + (gs.n > 1 ? 's' : '') + ')', '', '', '', fmtC(gs.m), gs.n > 1 ? fmtC(gs.sd) : '–'] : null);
}
function summaryPage(doc, header, geo){
  const formula = FORMULA;
  barPage(doc, header, geo, 'CFU/sample per group', groupTable(),
    'Bars: mean CFU/sample of the samples in each group. Error bars: standard deviation between samples (n > 1). ' + formula,
    [['Group', 46, 'l'], ['Samples', 16], ['Mean', 24], ['SD', 22], ['Median', 24], ['Min', 22], ['Max', 22]],
    r => [r.label, r.n, fmtC(r.m), r.n > 1 ? fmtC(r.sd) : '–', fmtC(r.median), fmtC(r.min), fmtC(r.max)]);
}
async function buildReport(exp, desc, withGraph){
  const { jsPDF } = window.jspdf, doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
  const PW = 210, PH = 297, M = 15, CW = PW - 2*M; // images poubelles (« Ignore ») absentes du rapport
  const keep = (r, i) => ((i ? p2Of(r) : r).status || '') !== 'ignored';
  // images regroupées par groupe (ordre de la liste des groupes, puis « No group ») ; en mode 2 boîtes, une image
  // dont les boîtes sont dans deux groupes apparaît dans chacun, avec seulement la ligne de la boîte du groupe
  const entries = [];
  files.forEach(f => { const r = data.images[f.name]; if (!r || r.pending) return;
    (dbl() ? [0, 1] : [0]).filter(i => keep(r, i)).forEach(i => entries.push({ f, r, i, g:fieldsOf(r, i).group || '' })); });
  const gOrder = [...new Set((data.groups || []).concat(entries.map(e => e.g)))].filter(g => entries.some(e => e.g === g)).sort((a, b) => (a === '') - (b === ''));
  const sections = gOrder.map(g => { const by = new Map();
    entries.filter(e => e.g === g).forEach(e => { if (!by.has(e.f)) by.set(e.f, []); by.get(e.f).push(e.i); });
    return { g, items:[...by].map(([f, pl]) => ({ f, pl })) }; });
  const total = sections.reduce((a, sc) => a + sc.items.length, 0);
  const date = new Date().toLocaleDateString('en-GB', { year:'numeric', month:'long', day:'numeric' });
  const header = () => {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(0);
    doc.text(doc.splitTextToSize('Count report: ' + exp, CW - 45)[0], M, 12);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90);
    if (desc) doc.text(doc.splitTextToSize(desc, CW)[0], M, 17);
    doc.text(date, PW - M, 12, { align:'right' });
    doc.setDrawColor(160); doc.setLineWidth(.2); doc.line(M, 20, PW - M, 20);
  };
  let y = 26, n = 0;
  for (const [si, sc] of sections.entries()){
    if (si) doc.addPage();
    header(); y = 26;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(0); doc.text('Group: ' + (sc.g || 'No group'), M, y + 4);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90);
    doc.text(sc.items.length + ' image' + (sc.items.length > 1 ? 's' : ''), PW - M, y + 4, { align:'right' }); y += 12;
    for (const { f, pl } of sc.items){
      toast(t('pdfBusy', { i:++n, n:total }));
      const r = data.images[f.name], im = await reportImage(f, r);
      let iw = CW, ih = CW * im.h / im.w; if (ih > 100){ ih = 100; iw = ih * im.w / im.h; }
      const blockH = ih + 6 + 7*(pl.length + 1) + 2;
      if (y + blockH > PH - 14){ doc.addPage(); header(); y = 26; }
      doc.addImage(im.url, 'JPEG', M + (CW - iw)/2, y, iw, ih);
      y += ih + 4;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(110);
      doc.text('Image: ' + f.name, M, y);
      y += 2;
      // tableau : en-têtes, puis une ligne par boîte (nom, dilution, volume, colonies)
      const rh = 7, wC = 24, wV = 26, wD = 30, c1 = CW - wC - wV - wD;
      const lines = pl.map(i => { const fl = fieldsOf(r, i), n = dbl() ? countOf(r, i) : r.marks.length;
        return [(dbl() ? (i + 1) + '. ' : '') + (finalName(fl) || stem(f.name) + (dbl() ? ' (' + (i + 1) + ')' : '')), fl.dilution || '–', fl.vol ? fl.vol + ' µL' : '–',
          fl.status === 'zero' ? '0' : fl.status === 'nc' ? 'NC' : String(n)]; });
      doc.setDrawColor(0); doc.setLineWidth(.25); doc.setFillColor(235, 235, 235);
      doc.rect(M, y, CW, rh, 'FD'); lines.forEach((_, k) => doc.rect(M, y + rh*(k + 1), CW, rh));
      [c1, c1 + wD, c1 + wD + wV].forEach(xx => doc.line(M + xx, y, M + xx, y + rh*(lines.length + 1)));
      doc.setTextColor(0); doc.setFontSize(10); doc.setFont('helvetica', 'bold');
      doc.text('Name', M + 2, y + 4.8); doc.text('Dilution', M + c1 + wD - 2, y + 4.8, { align:'right' }); doc.text('Volume', M + c1 + wD + wV - 2, y + 4.8, { align:'right' }); doc.text('CFU', M + CW - 2, y + 4.8, { align:'right' });
      doc.setFont('helvetica', 'normal');
      lines.forEach(([nm, d, v, n], k) => { const yy = y + rh*(k + 1) + 4.8;
        doc.text(doc.splitTextToSize(nm, c1 - 4)[0], M + 2, yy); doc.text(d, M + c1 + wD - 2, yy, { align:'right' }); doc.text(v, M + c1 + wD + wV - 2, yy, { align:'right' }); doc.text(n, M + CW - 2, yy, { align:'right' }); });
      y += rh*(lines.length + 1) + 10;
    }
    groupSummary(doc, header, { PW, PH, M, CW }, sc.g);
  }
  if (!sections.length) header();
  if (withGraph && sections.length > 1) summaryPage(doc, header, { PW, PH, M, CW });
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++){
    doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(110);
    doc.text('Page ' + i + ' / ' + pages, M, PH - 8);
    doc.text('Captured using Petri-Scanner and counted using Petri-Counter', PW - M, PH - 8, { align:'right' });
  }
  return doc.output('blob');
}
// clic sur « Rapport » : fenêtre pour le nom de l'expérience (obligatoire) et une courte description
let pdfHereTarget = false;
function askPdf(here){
  openMenu(false);
  if (!window.jspdf){ toast(t('pdfNoLib')); return; }
  pdfHereTarget = here;
  const rp = data.report || {}; $('inExp').value = rp.name || ''; $('inDesc').value = rp.desc || ''; $('cGraphPdf').checked = !!rp.graph;
  $('pdfDlg').showModal(); $('inExp').focus();
}
$('pdfHere').addEventListener('click', () => askPdf(true));
$('pdfElse').addEventListener('click', () => askPdf(false));
$('pdfCancel').addEventListener('click', () => $('pdfDlg').close());
$('pdfForm').addEventListener('submit', async e => {
  e.preventDefault();
  const exp = $('inExp').value.trim(), desc = $('inDesc').value.trim();
  if (!exp){ $('inExp').focus(); return; }
  $('pdfDlg').close();
  const withGraph = $('cGraphPdf').checked;
  data.report = { name:exp, desc, graph:withGraph }; // repris la prochaine fois pour ce dossier
  try{
    // REPORT-AAAA-MM-JJ-nom de l'expérience.pdf (accents retirés, caractères interdits dans un nom de fichier remplacés)
    const d = new Date(), day = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const safe = exp.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.-]+/g, '_').replace(/^_+|_+$/g, '');
    const tg = await pickTarget('REPORT-' + day + '-' + safe + '.pdf', 'application/pdf', 'pdf', pdfHereTarget);
    if (!tg) return;
    await saveNow();
    toast(t('pdfDone', { f: await writeTarget(tg, await buildReport(exp, desc, withGraph)) }));
  }catch(err){ console.error(err); toast(t('saveErr')); }
});

/* ---------- Clavier ---------- */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z' && !typing){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y' && !typing){ e.preventDefault(); redo(); return; }
  if (typing){ if (e.key === 'Enter' && document.activeElement.id !== 'inGroup') document.activeElement.blur(); return; }
  if (e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); if (idx < files.length - 1) show(idx + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); if (idx > 0) show(idx - 1); }
  else if (e.key === '0') fit();
});

showEmpty(true);
applyLang();
renderAll(); // panneau de droite déjà complet (« + » des groupes, nom final) avant le choix d'un dossier
})();
</script>
